<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>蚁穴之下 · 网页测试版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; touch-action: none; }
  #game { width: 100vw; height: 100vh; touch-action: none; display: block; }
  .hud { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; z-index: 10; pointer-events: none; }
  .hud-item { background: rgba(22,33,62,.85); border: 1px solid #2a3a5e; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #e8e8e8; }
  .mode-tip { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); background: rgba(233,69,96,.92); color: #fff; font-size: 12px; padding: 5px 14px; border-radius: 14px; z-index: 10; pointer-events: none; white-space: nowrap; display: none; }
  .toolbar { position: fixed; bottom: 44px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; justify-content: center; z-index: 10; }

  .tool.active { border-color: #e94560; background: rgba(233,69,96,.25); }
  .tool-icon { font-size: 20px; }
  .tool-name { font-size: 11px; color: #e8e8e8; margin-top: 2px; }

  #toast { position: fixed; top: 45%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 14px; z-index: 99; display: none; max-width: 80vw; text-align: center; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="hud-item" id="hud-pop">👥 20</div>
  <div class="hud-item" id="hud-food">🍞 100</div>
  <div class="hud-item" id="hud-day">⏱ 0 天</div>
  <div class="hud-item" id="hud-stage" style="pointer-events:auto;cursor:pointer" title="点击查看晋升条件">蛮荒 <span id="hud-progress">0%</span></div>
  <div class="hud-item" id="hud-rival">🏡 对岸：平静</div>
  <div class="hud-item" id="btn-history" style="pointer-events:auto;cursor:pointer">📜</div>
</div>
<div id="history-overlay" style="display:none; position:fixed; inset:0; background:rgba(26,26,46,.97); z-index:50; overflow-y:auto; padding:16px;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div style="font-size:18px; color:#e94560; font-weight:bold;">📜 文明史记</div>
    <div id="btn-close-history" style="color:#e8e8e8; cursor:pointer; font-size:22px; padding:4px 12px;">✕</div>
  </div>
  <div id="history-body" style="color:#c5cbe0; font-size:13px; line-height:1.9; margin-top:12px;"></div>
  <div id="btn-reset" style="margin:20px auto; width:140px; text-align:center; padding:8px 0; border:1px solid #e94560; color:#e94560; border-radius:20px; cursor:pointer;">重启文明</div>
</div>
<div class="mode-tip" id="mode-tip"></div>
<div class="toolbar">
  <div class="tool" data-type="raise"><span class="tool-icon">⛰️</span><span class="tool-name">造山</span></div>
  <div class="tool" data-type="lower"><span class="tool-icon">⛏️</span><span class="tool-name">铲平</span></div>
  <div class="tool" data-type="raid"><span class="tool-icon">⚔️</span><span class="tool-name">掠夺</span></div>
  <div class="tool" data-type="rock"><span class="tool-icon">🪨</span><span class="tool-name">巨石</span></div>
  <div class="tool" data-type="flood"><span class="tool-icon">🌊</span><span class="tool-name">洪水</span></div>
  <div class="tool" data-type="wind"><span class="tool-icon">🌪️</span><span class="tool-name">飓风</span></div>
  <div class="tool" data-type="food"><span class="tool-icon">🍞</span><span class="tool-name">神粮</span></div>
  <div class="tool" data-type="remove"><span class="tool-icon">✋</span><span class="tool-name">神之手</span></div>
  <div class="tool" data-type="accelerate"><span class="tool-icon">⏩</span><span class="tool-name">加速</span></div>
  <div class="tool" id="btn-pause"><span class="tool-icon">⏸️</span><span class="tool-name">暂停</span></div>
</div>
<div class="log" id="log"></div>
<div id="btn-undo" style="display:none; position:fixed; bottom:118px; right:10px; background:rgba(22,33,62,.92); border:1px solid #2a3a5e; border-radius:18px; padding:6px 14px; color:#e8e8e8; font-size:12px; z-index:20; cursor:pointer; user-select:none; -webkit-user-select:none;">↩️ 撤销</div>
<div id="challenge" style="display:none; position:fixed; bottom:118px; left:50%; transform:translateX(-50%); background:rgba(233,69,96,.92); color:#fff; border-radius:10px; padding:6px 14px; font-size:12px; z-index:20; white-space:nowrap; max-width:70vw; overflow:hidden; text-overflow:ellipsis;"></div>
<div id="toast"></div>
<div id="err-banner" style="display:none; position:fixed; left:12px; right:12px; top:30%; background:#5a1626; color:#ffd7dd; padding:14px; border-radius:10px; font-size:13px; z-index:999; word-break:break-all;"></div>

// ---------- 全局错误兜底：黑屏时把人话错误显示出来，方便定位 ----------
window.__gameError = function(msg) {
  var b = document.getElementById('err-banner');
  if (b) { b.textContent = '❌ 游戏加载失败：' + msg; b.style.display = 'block'; }
};
window.addEventListener('error', function(e) {
  window.__gameError((e.message || '未知错误') + ' @' + (e.lineno || '?') + '行');
});

__define('utils/iso', "/**\n * 等距投影工具（文档 4.1 原公式）\n */\nfunction gridToScreen(gridX, gridY, tileSize) {\n  return {\n    x: (gridX - gridY) * (tileSize / 2),\n    y: (gridX + gridY) * (tileSize / 4)\n  };\n}\n\nfunction screenToGrid(screenX, screenY, tileSize) {\n  const gridX = (screenX / (tileSize / 2) + screenY / (tileSize / 4)) / 2;\n  const gridY = (screenY / (tileSize / 4) - screenX / (tileSize / 2)) / 2;\n  return { x: Math.floor(gridX), y: Math.floor(gridY) };\n}\n\nmodule.exports = { gridToScreen, screenToGrid };\n");
__define('utils/ad-manager', "/**\n * 广告管理器（utils/ad-manager.js）\n * IAA 统一入口：有 adUnitId 走真实激励视频，留空走演示弹窗。\n * UI 无感知：上线只需在 config.js 填 AD_UNIT_ID。\n */\nconst config = require('../data/config');\n\nclass AdManager {\n  /**\n   * @param {Object} opts\n   *   adUnitId  广告位 id（默认读 config.AD_UNIT_ID）\n   *   mockDialog 演示模式弹窗，返回 Promise<boolean>（true=看完）\n   */\n  constructor(opts) {\n    this.adUnitId = (opts && opts.adUnitId) || config.AD_UNIT_ID;\n    this.mockDialog = (opts && opts.mockDialog) || function() { return Promise.resolve(true); };\n    this.ad = null;   // 惰性创建\n    this.onCloseHandler = null;\n  }\n\n  /**\n   * 播放激励视频\n   * @param {Function} onReward 看完/演示确认\n   * @param {Function} onSkip   中途退出/加载失败\n   */\n  showRewarded(onReward, onSkip) {\n    onSkip = onSkip || function() {};\n\n    // 演示模式\n    if (!this.adUnitId) {\n      this.mockDialog()\n        .then(ok => ok ? onReward() : onSkip())\n        .catch(() => onSkip());\n      return;\n    }\n\n    // 真实广告（仅小程序环境）\n    if (typeof wx === 'undefined' || !wx.createRewardedVideoAd) { onSkip(); return; }\n    try {\n      if (!this.ad) {\n        this.ad = wx.createRewardedVideoAd({ adUnitId: this.adUnitId });\n      }\n      if (this.onCloseHandler) this.ad.offClose(this.onCloseHandler);\n      this.onCloseHandler = res => {\n        if (res && res.isEnded) onReward();\n        else onSkip();\n      };\n      this.ad.onClose(this.onCloseHandler);\n      this.ad.show().catch(() => {\n        // 失败重载一次再试\n        this.ad.load()\n          .then(() => this.ad.show())\n          .catch(() => onSkip());\n      });\n    } catch (e) {\n      onSkip();\n    }\n  }\n}\n\nmodule.exports = { AdManager };\n");
__define('game-engine/elevation', "/**\n * 地形高度场（game-engine/elevation.js）\n * 纯函数式、确定性（坐标哈希），渲染/寻路共用。\n * 不写入存档 → 旧档自动获得同一套地形。\n *\n * 等级：0=滩地/水面  1~4 逐级抬升；|Δ|≥2 视为悬崖（不可通行），1 级差为缓坡。\n */\nconst config = require('../data/config');\n\nconst MAX_LEVEL = 4;\nconst UNIT = 0.42;            // 每级高度（× tH），渲染用（偏低更自然）\nconst FLAT_RADIUS = 4;        // 巢穴广场平整半径（保证未解锁攀爬时生存空间足够大）\nconst CLIMB_STAGE = 2;        // 协作期解锁「土坡木梯」：可爬 1 级缓坡\n\n/** 当前攀爬能力（可达越过的最大级差）：工具未解锁前只能走平地 */\nfunction maxStepOf(world) {\n  return world.colony && world.colony.evolutionStage >= CLIMB_STAGE ? 1 : 0;\n}\n\n/** 确定性值噪声 [0,1) */\nfunction noise(x, y) {\n  const h = (ix, iy) => {\n    let n = (ix * 73856093) ^ (iy * 19349663) ^ ((ix + iy) * 83492791);\n    n = Math.imul(n ^ (n >>> 13), 1274126177);\n    return ((n ^ (n >>> 16)) >>> 0) / 4294967295;\n  };\n  const xi = Math.floor(x), yi = Math.floor(y);\n  const s = t => t * t * (3 - 2 * t);\n  const u = s(x - xi), v = s(y - yi);\n  return h(xi, yi) * (1 - u) * (1 - v) + h(xi + 1, yi) * u * (1 - v)\n       + h(xi, yi + 1) * (1 - u) * v + h(xi + 1, yi + 1) * u * v;\n}\n\n/** 原始等级（宏观布局：上方山系 → 中部平原 → 平原背后高山） */\nfunction rawLevel(x, y) {\n  let n = noise(x / 5.2 + 3.7, y / 5.2 + 9.1);\n  // 沙盘上方（x+y 小，越靠顶角越高）为山系\n  const s = x + y;\n  if (s < 10) n += 0.34;\n  else if (s < 16) n += 0.18;\n  // 右后角（平原背后）高山，右侧边缘也抬起（参考图右侧灰岩群峰）\n  const dCorner = Math.hypot(x - 29, y);\n  if (dCorner < 11) n += (11 - dCorner) / 11 * 0.45;\n  if (x > 26) n += 0.2;\n  // 其余压平为河畔平原（避开上方山带与右侧山带）\n  if (s > 18 && dCorner > 11) n = Math.min(n, 0.44);\n  if (n < 0.30) return 0;\n  if (n < 0.48) return 1;\n  if (n < 0.66) return 2;\n  if (n < 0.82) return 3;\n  return 4;\n}\n\n/** 巢穴广场基准等级 */\nconst NEST_LEVEL = rawLevel(config.NEST.x, config.NEST.y);\n\n/**\n * 地形台阶等级。\n * 水/桥恒 0（水面在谷底，桥贴水面）；邻水最多 1 级（下切河谷缓岸）；\n * 巢穴周围 FLAT_RADIUS 内强制平坦（保证出生点四通）。\n */\nfunction levelAt(world, x, y) {\n  const t = world.getTile(x, y);\n  if (!t) return 0;\n  if (t.terrain === 'water' || t.terrain === 'bridge' || t.terrain === 'shallow') return 0;\n\n  // 玩家捏地形改写表（沙盘搭建）：命中则直接采用，0~4 已在写入时封顶\n  const ov = world.terrainOverrides && world.terrainOverrides[y * world.width + x];\n  if (ov !== undefined) return ov;\n\n  // 巢穴广场 + 外圈缓坡带（保证出生点四通八达，永不被悬崖封死）\n  const nest = config.NEST;\n  const dNest = Math.max(Math.abs(x - nest.x), Math.abs(y - nest.y));\n  if (dNest <= FLAT_RADIUS) return NEST_LEVEL;\n  if (dNest <= FLAT_RADIUS + 1) {\n    return Math.max(NEST_LEVEL - 1, Math.min(NEST_LEVEL + 1, rawLevel(x, y)));\n  }\n\n  let lvl = rawLevel(x, y);\n  if (lvl > 1) {\n    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];\n    for (const d of dirs) {\n      const nb = world.getTile(x + d[0], y + d[1]);\n      if (!nb) continue;\n      // 邻水 → 下切河谷缓岸；邻桥 → 上下桥缓坡（桥面为 0 级）\n      if (nb.terrain === 'water' || nb.terrain === 'bridge') { lvl = 1; break; }\n    }\n  }\n  return lvl;\n}\n\n/** 通行判定：级差超过攀爬能力即悬崖。未解锁工具只能平地走；协作期起可爬 1 级缓坡 */\nfunction canTraverse(world, fromX, fromY, toX, toY, maxStep) {\n  const climb = maxStep !== undefined ? maxStep : maxStepOf(world);\n  return Math.abs(levelAt(world, toX, toY) - levelAt(world, fromX, fromY)) <= climb;\n}\n\nmodule.exports = { noise, levelAt, canTraverse, rawLevel, maxStepOf, MAX_LEVEL, UNIT, NEST_LEVEL, CLIMB_STAGE };\n");
__define('systems/pathfinding', "/**\n * A* 寻路（systems/pathfinding.js）\n * 地图 30x30，用简单数组开放列表即可，不做二叉堆优化。\n */\nconst config = require('../data/config');\nconst elevation = require('../game-engine/elevation');\n\nfunction findPath(world, startX, startY, endX, endY, maxStep) {\n  const W = world.width, H = world.height;\n  if (!world.isWalkable(endX, endY)) return null;\n\n  const open = [];\n  const cameFrom = new Map();\n  const gScore = new Map();\n  const key = (x, y) => y * W + x;\n\n  const h = (x, y) => Math.abs(x - endX) + Math.abs(y - endY);\n\n  open.push({ x: startX, y: startY, f: h(startX, startY) });\n  gScore.set(key(startX, startY), 0);\n\n  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];\n  let guard = 0;\n\n  while (open.length > 0 && guard++ < 8000) {\n    // 取 f 最小\n    let bi = 0;\n    for (let i = 1; i < open.length; i++) {\n      if (open[i].f < open[bi].f) bi = i;\n    }\n    const cur = open.splice(bi, 1)[0];\n\n    if (cur.x === endX && cur.y === endY) {\n      // 回溯路径\n      const path = [];\n      let k = key(cur.x, cur.y);\n      let cx = cur.x, cy = cur.y;\n      while (!(cx === startX && cy === startY)) {\n        path.push({ x: cx, y: cy });\n        const prev = cameFrom.get(k);\n        cx = prev.x; cy = prev.y;\n        k = key(cx, cy);\n      }\n      return path.reverse();\n    }\n\n    for (const [dx, dy] of dirs) {\n      const nx = cur.x + dx, ny = cur.y + dy;\n      if (!world.isWalkable(nx, ny)) continue;\n      // 身高/悬崖判定：级差超过攀爬能力不可逾越（协作期前只能平地走）\n      if (!elevation.canTraverse(world, cur.x, cur.y, nx, ny, maxStep)) continue;\n      const nk = key(nx, ny);\n      const tentative = gScore.get(key(cur.x, cur.y)) + 1;\n      if (tentative < (gScore.has(nk) ? gScore.get(nk) : Infinity)) {\n        cameFrom.set(nk, { x: cur.x, y: cur.y });\n        gScore.set(nk, tentative);\n        open.push({ x: nx, y: ny, f: tentative + h(nx, ny) });\n      }\n    }\n  }\n  return null;\n}\n\n/** 找最近的可通行格（用于吹散/逃离落点修正） */\nfunction nearestWalkable(world, x, y) {\n  if (world.isWalkable(x, y)) return { x, y };\n  for (let r = 1; r < config.MAP_WIDTH; r++) {\n    for (let dy = -r; dy <= r; dy++) {\n      for (let dx = -r; dx <= r; dx++) {\n        if (world.isWalkable(x + dx, y + dy)) return { x: x + dx, y: y + dy };\n      }\n    }\n  }\n  return { x: config.NEST.x, y: config.NEST.y };\n}\n\nmodule.exports = { findPath, nearestWalkable };\n");
__define('game-engine/rival-tribe', "/**\n * 对岸部落（game-engine/rival-tribe.js）\n * 河对岸住着「黑岩部落」：潜伏 → 敌对 → 记仇 → 臣服 的状态机。\n * 冲突玩法：玩家远征掠夺（⚔️）↔ 敌方渡河反抢；河上浅滩是双方必争的咽喉。\n * 身高规则对敌人同样生效：玩家捏的高墙能真正挡住劫掠队。\n */\nconst config = require('../data/config');\nconst pf = require('../systems/pathfinding');\nconst elevation = require('./elevation');\n\nfunction randInt(n) { return Math.floor(Math.random() * n); }\n\n/** 河上凿出两处浅滩渡口（南北各一，战略咽喉）。\n *  选点要求：两岸高度 ≤1，保证协作期（maxStep=1）必定能过河。 */\nfunction carveFords(world) {\n  const ok = [];\n  for (let y = 3; y < world.height - 3; y++) {\n    const waters = world.tiles.filter(t => t.y === y && t.terrain === 'water');\n    if (waters.length < 2) continue;\n    const xs = waters.map(t => t.x);\n    const left = world.getTile(Math.min(...xs) - 1, y);\n    const right = world.getTile(Math.max(...xs) + 1, y);\n    if (!left || !right || !left.walkable || !right.walkable) continue;\n    const lvls = [left, right, waters[0], waters[1]].map(t => elevation.rawLevel(t.x, t.y));\n    if (Math.max(...lvls) > 1) continue;   // 两岸有悬崖的渡口不要\n    ok.push(y);\n  }\n  if (!ok.length) return 0;\n  // 一南一北两个渡口，拉开距离\n  const pick = [ok[0]];\n  const far = ok.filter(y => Math.abs(y - ok[0]) >= 8);\n  if (far.length) pick.push(far[Math.floor(far.length / 2)]);\n  let carved = 0;\n  for (const fy of pick) {\n    for (const t of world.tiles) {\n      if (t.y === fy && t.terrain === 'water') {\n        t.terrain = 'shallow';\n        t.walkable = true;\n      }\n    }\n    carved++;\n  }\n  return carved;\n}\n\n/** 生成对岸部落（左岸平原）+ 浅滩渡口 + 农田；已存在则跳过 */\nfunction ensureRival(world) {\n  if (world.rival) return false;\n  const carve = carveFords(world);\n\n  // 巢穴：左岸（x<18）平缓处，且必须能从玩家巢穴跨浅滩走到（保证玩法闭环）\n  const cfg = config.RIVAL;\n  const nest = config.NEST;\n  const cands = world.tiles.filter(t =>\n    t.walkable && !t.object && t.x < 18 &&\n    (t.terrain === 'grass' || t.terrain === 'dirt' || t.terrain === 'stone') &&\n    Math.max(Math.abs(t.x - nest.x), Math.abs(t.y - nest.y)) >= 10 &&\n    elevation.levelAt(world, t.x, t.y) <= 1);\n  // 随机试选，寻路验证跨河可达\n  for (let g = 0; g < 200 && cands.length; g++) {\n    const idx = randInt(cands.length);\n    const t = cands[idx];\n    const path = pf.findPath(world, nest.x, nest.y, t.x, t.y, 1);\n    if (path) {\n      t.object = 'rivalNest';\n      t.walkable = true;\n      world.rival = {\n        x: t.x, y: t.y,\n        name: cfg.name,\n        food: cfg.baseFood,\n        warriors: cfg.baseWarriors,\n        strength: cfg.baseStrength,\n        mood: 'dormant',       // dormant 潜伏 / hostile 敌对 / vengeful 记仇 / subjugated 臣服\n        grudge: 0,\n        lastStealTick: 0,\n        tributeTick: 0\n      };\n      if (!world.rivalCrops) world.rivalCrops = [];\n      spawnCrops(world);\n      return true;\n    }\n    cands.splice(idx, 1);\n  }\n  return false;\n}\n\n/** 敌方农田：左岸分配可耕种的土地，收成养部落（玩家可远征烧田断其经济） */\nfunction spawnCrops(world) {\n  if (!world.rival) return 0;\n  const cfg = config.RIVAL.crops;\n  const r = world.rival;\n  const nest = config.NEST;\n  const cands = world.tiles.filter(t =>\n    t.walkable && !t.object && t.x < 18 &&\n    (t.terrain === 'grass' || t.terrain === 'dirt') &&\n    Math.max(Math.abs(t.x - r.x), Math.abs(t.y - r.y)) >= 3 &&\n    Math.max(Math.abs(t.x - nest.x), Math.abs(t.y - nest.y)) >= 8 &&\n    pf.findPath(world, r.x, r.y, t.x, t.y, 1));\n  const placed = [];\n  let guard = cands.length * 2 + 20;\n  while (placed.length < cfg.count && cands.length && guard-- > 0) {\n    const idx = randInt(cands.length);\n    const t = cands[idx];\n    cands.splice(idx, 1);\n    // 田块间至少隔 2 格，看起来像分散的农田\n    if (placed.some(p => Math.max(Math.abs(p.x - t.x), Math.abs(p.y - t.y)) < 3)) continue;\n    t.terrain = 'crop';\n    t.walkable = true;\n    world.rivalCrops.push({ x: t.x, y: t.y, amount: cfg.amount });\n    placed.push(t);\n  }\n  return placed.length;\n}\n\nconst MOOD_LABEL = {\n  dormant: '暗流涌动',\n  hostile: '敌对',\n  vengeful: '记仇',\n  subjugated: '已臣服'\n};\n\nclass RivalTribe {\n  constructor(world, ants, interventions) {\n    this.world = world;\n    this.ants = ants;\n    this.iv = interventions || null;   // 借用 scare 制造被劫恐慌\n    world.rivalForagers = [];          // 敌方农夫（可见的自动屯粮）\n    world.rivalPatrol = null;          // 敌方巡逻队\n    this.foragers = world.rivalForagers;\n  }\n\n  tick() {\n    const world = this.world;\n    const r = world.rival;\n    if (!r) return;\n    const c = world.colony;\n    const cfg = config.RIVAL;\n\n    // 侦察：潜伏期结束，双方互相发现\n    if (r.mood === 'dormant' && c.totalTicks >= cfg.scoutTicks) {\n      r.mood = 'hostile';\n      world.log(`对岸的高草丛里出现了陌生的身影——${r.name}发现了你们的粮仓！`);\n    }\n\n    // 敌方缓慢成长（压力随时间上升，逼玩家主动出击或筑防）；收成由农田供养\n    if (r.mood !== 'subjugated' && c.totalTicks % cfg.growEveryTicks === 0) {\n      const activeCrops = (world.rivalCrops || []).filter(cp => cp.amount > 0).length;\n      r.food = Math.min(cfg.maxFood, r.food + 2 + activeCrops);\n      r.strength = Math.min(cfg.maxStrength, r.strength + 1);\n      if (r.warriors < cfg.maxWarriors && activeCrops >= 3 && c.totalTicks % (cfg.growEveryTicks * 2) === 0) {\n        r.warriors++;\n        if (r.mood !== 'dormant') world.log(`${r.name}仓廾充实，又添了新的战士（共 ${r.warriors} 名）`);\n      }\n    }\n\n    // 农田自然再熟\n    if (c.totalTicks % cfg.crops.regrowEveryTicks === 0) {\n      for (const cp of (world.rivalCrops || [])) {\n        if (cp.amount > 0 && cp.amount < cfg.crops.amount) {\n          cp.amount = Math.min(cfg.crops.amount, cp.amount + cfg.crops.regrowAmount);\n        }\n      }\n    }\n\n    // 敌方渡河反抢（记仇时更频繁）\n    if ((r.mood === 'hostile' || r.mood === 'vengeful') &&\n        c.totalFood >= cfg.raidTriggerFood &&\n        c.totalTicks - r.lastStealTick >= Math.round(cfg.raidEveryTicks * (r.mood === 'vengeful' ? 0.6 : 1))) {\n      this.tryCounterRaid();\n    }\n\n    // 臣服朝贡\n    if (r.mood === 'subjugated' && c.totalTicks >= r.tributeTick) {\n      r.tributeTick = c.totalTicks + cfg.tributeEveryTicks;\n      r.food = Math.min(cfg.maxFood, r.food + 10);\n      c.totalFood += cfg.tributeFood;\n      world.log(`${r.name}送来了朝贡的粮车（+${cfg.tributeFood} 粮食）`);\n    }\n\n    // 推进双方远征/劫掠队\n    this.advanceParties();\n\n    // 敌方自主行为：农夫屯粮 + 战士巡逻\n    this.ensureAgents();\n    this.tickAgents();\n    // 渡口遭遇战：两军狭路相逢就地开打\n    this.checkEncounters();\n  }\n\n  /** 农夫/巡逻队的生成与指派（不进存档，读档自动重建） */\n  ensureAgents() {\n    const world = this.world;\n    const r = world.rival;\n    if (!r) return;\n    if (r.mood === 'subjugated') {\n      world.rivalForagers = [];\n      world.rivalPatrol = null;\n      this.foragers = world.rivalForagers;\n      return;\n    }\n    // 农夫：最多 2 人轮作\n    const activeCrops = (world.rivalCrops || []).filter(cp => cp.amount > 0);\n    if (this.foragers.length < Math.min(2, activeCrops.length)) {\n      this.foragers.push({ x: r.x, y: r.y, state: 'toField', path: null, pathIdx: 0, harvest: 0 });\n    }\n    // 巡逻队：敌对且战士≥4，2 人小队巡视渡口与西岸\n    if ((r.mood === 'hostile' || r.mood === 'vengeful') && !world.rivalPatrol && r.warriors >= 4) {\n      const wps = this.patrolWaypoints();\n      if (wps.length >= 2) {\n        world.rivalPatrol = { x: r.x, y: r.y, wp: wps, wpIdx: 0, path: null, pathIdx: 0, size: 2 };\n      }\n    }\n  }\n\n  patrolWaypoints() {\n    const world = this.world;\n    const r = world.rival;\n    const wps = world.tiles.filter(t => t.terrain === 'shallow').map(t => ({ x: t.x, y: t.y }));\n    wps.push({ x: Math.max(2, r.x - 4), y: r.y });   // 西岸腹地\n    return wps;\n  }\n\n  pickCrop() {\n    const a = (this.world.rivalCrops || []).filter(cp => cp.amount > 0);\n    return a.length ? a[randInt(a.length)] : null;\n  }\n\n  moveAlong(e, speed) {\n    const node = e.path[e.pathIdx];\n    const dx = node.x - e.x, dy = node.y - e.y;\n    const dist = Math.abs(dx) + Math.abs(dy);\n    if (dist <= speed) { e.x = node.x; e.y = node.y; e.pathIdx++; }\n    else {\n      e.x += Math.sign(dx) * Math.min(speed, Math.abs(dx));\n      e.y += Math.sign(dy) * Math.min(speed, Math.abs(dy));\n e').ensureRival(this);\n  }\n\n  generateMap() {\n    const { width, height } = this;\n    for (let y = 0; y < height; y++) {\n      for (let x = 0; x < width; x++) {\n        let terrain = 'grass';\n        const r = Math.random();\n        // 对角河：正弦蜿蜒双河道（宽 2，摆幅加大，斜贯整个沙盘）\n        const bend = Math.round(Math.sin(y * 0.5) * 1.8);\n        if (x === 20 + bend || x === 21 + bend) {\n          terrain = 'water';\n        } else if (r < 0.08) {\n          terrain = 'dirt';\n        } else if (r < 0.11) {\n          terrain = 'stone';\n        }\n        this.tiles.push({\n          x, y,\n          terrain,\n          elevation: 0,\n          object: null,\n          objectHp: 0,\n          walkable: terrain !== 'water',\n          lastEvent: null\n        });\n      }\n    }\n\n    // 巢穴\n    const nest = this.getTile(config.NEST.x, config.NEST.y);\n    if (nest) {\n      nest.terrain = 'dirt';\n      nest.object = 'nest';\n      nest.walkable = true;\n    }\n\n    // 食物源：随机放置在可通行格，且必须与巢穴连通（河流天堑对岸的源无意义）\n    const { findPath } = require('../systems/pathfinding');\n    let placed = 0, guard = 0;\n    while (placed < config.INITIAL_FOOD_SOURCES && guard++ < 500) {\n      const t = this.tiles[randInt(this.tiles.length)];\n      if (t.walkable && !t.object && t.terrain !== 'food') {\n        if (!findPath(this, config.NEST.x, config.NEST.y, t.x, t.y)) continue;\n        t.terrain = 'food';\n        t.walkable = true;\n        this.foodSources.push({ x: t.x, y: t.y, amount: config.FOOD_PER_SOURCE, type: 'berry' });\n        placed++;\n      }\n    }\n  }\n\n  /** 特殊资源地形：大树 / 山岗 / 湖心莲籽（各阶段的招牌考题）\n   *  按需补种：新世界三种全生成；旧存档恢复后缺啥补啥（补种提示由调用方播报） */\n  generateSpecialFood() {\n    // 只看类型是否出现过（amount 为 0 靠 regrowLake/再熟机制恢复，不重复挖坑）\n    const has = t => this.foodSources.some(f => f.type === t);\n    let added = false;\n    if (!has('tree')) { this.spawnTree(); added = true; }\n    if (!has('hill')) { this.spawnHill(); added = true; }\n    if (!has('lake')) { this.spawnLake(); added = true; }\n    return added;\n  }\n\n  /** 从巢穴 BFS 可达集（含身高规则）；资源落位统一从这里选点，保证永远可达 */\n  reachableTiles(maxStep) {\n    const elevation = require('./elevation');\n    const W = this.width, H = this.height;\n    const seen = new Set([config.NEST.y * W + config.NEST.x]);\n    const queue = [[config.NEST.x, config.NEST.y]];\n    const out = [];\n    while (queue.length) {\n      const [cx, cy] = queue.shift();\n      const t = this.getTile(cx, cy);\n      if (t && t.walkable && !t.object) out.push(t);\n      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {\n        const nx = cx + dx, ny = cy + dy, k = ny * W + nx;\n        if (nx < 0 || ny < 0 || nx >= W || ny >= H || seen.has(k)) continue;\n        const nt = this.getTile(nx, ny);\n        if (!nt || !nt.walkable) continue;\n        if (!elevation.canTraverse(this, cx, cy, nx, ny, maxStep)) continue;\n        seen.add(k);\n        queue.push([nx, ny]);\n      }\n    }\n    return out;\n  }\n\n  spawnTree() {\n    const cfg = config.SPECIAL_FOOD;\n    const nest = config.NEST;\n    const cheb = (x, y) => Math.max(Math.abs(x - nest.x), Math.abs(y - nest.y));\n    // 平地可达集（聚集期尚未解锁攀爬，果树必须能走到）\n    const cands = this.reachableTiles(0).filter(t =>\n      (t.terrain === 'grass' || t.terrain === 'dirt') && cheb(t.x, t.y) >= 4);\n    // 平原上散布 3 棵果树（彼此至少隔 3 格），像参考图那样点缀平原\n    const placed = [];\n    let guard = cands.length * 2 + 10;\n    while (placed.length < 3 && cands.length && guard-- > 0) {\n      const idx = randInt(cands.length);\n      const t = cands[idx];\n      if (placed.some(p => Math.max(Math.abs(p.x - t.x), Math.abs(p.y - t.y)) < 3)) {\n        cands.splice(idx, 1);\n        continue;\n      }\n      cands.splice(idx, 1);\n      t.terrain = 'tree';\n      t.walkable = true;\n      this.foodSources.push({ x: t.x, y: t.y, amount: cfg.tree.amount, type: 'tree' });\n      placed.push(t);\n    }\n  }\n\n  spawnHill() {\n    const cfg = config.SPECIAL_FOOD;\n    const nest = config.NEST;\n    const cheb = (x, y) => Math.max(Math.abs(x - nest.x), Math.abs(y - nest.y));\n    const elevation = require('./elevation');\n    // 协作期解锁攀爬后按 Δ≤1 规则的可达集\n    const reachKeys = new Set(this.reachableTiles(1).map(t => t.y * this.width + t.x));\n    const cands = this.tiles.filter(t => {\n      if (!t.walkable || t.object || t.terrain === 'water' || t.terrain === 'tree' || t.terrain === 'food') return false;\n      if (cheb(t.x, t.y) < 4) return false;\n      // 必须存在「可达 且 与山岗只差缓坡」的邻格\n      return [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {\n        const nb = this.getTile(t.x + dx, t.y + dy);\n        return nb && nb.walkable && !nb.object && nb.terrain !== 'water' && nb.terrain !== 'hill' &&\n          Math.abs(elevation.levelAt(this, t.x, t.y) - elevation.levelAt(this, nb.x, nb.y)) <= 1 &&\n          reachKeys.has(nb.y * this.width + nb.x);\n      });\n    });\n    if (!cands.length) return;\n    const t = cands[randInt(cands.length)];\n    t.terrain = 'hill';\n    t.walkable = true;\n    this.foodSources.push({ x: t.x, y: t.y, amount: cfg.hill.amount, type: 'hill' });\n  }\n\n  spawnLake() {\n    const cfg = config.SPECIAL_FOOD;\n    const nest = config.NEST;\n    const cheb = (x, y) => Math.max(Math.abs(x - nest.x), Math.abs(y - nest.y));\n    // 椭圆湖：5 宽 3 高（11 格），视觉上更像湖泊\n    const inLake = (dx, dy) => Math.abs(dx) <= 2 && Math.abs(dy) <= 1 && !(Math.abs(dx) === 2 && Math.abs(dy) !== 0);\n    const elevation = require('./elevation');\n    const reachKeys = new Set(this.reachableTiles(1).map(t => t.y * this.width + t.x));\n    for (let g = 0; g < 400; g++) {\n      const cx = 23 + randInt(4);   // 湖在河畔平原一侧（与巢穴同岸，可开发）\n      const cy = 2 + randInt(this.height - 4);\n      if (cheb(cx, cy) < 7) continue;\n      // 至少一个未来岸格（外圈 cheb≤4）可达，否则湖会变成永远开发不了的天堑\n      let shoreOk = false;\n      for (let dx = -4; dx <= 4 && !shoreOk; dx++) {\n        for (let dy = -4; dy <= 4 && !shoreOk; dy++) {\n          if (Math.abs(dx) <= 2 && Math.abs(dy) <= 1) continue;\n          if (Math.max(Math.abs(dx), Math.abs(dy)) > 4) continue;\n          const st = this.getTile(cx + dx, cy + dy);\n          if (st && st.walkable && !st.object && st.terrain !== 'water' &&\n              reachKeys.has((cy + dy) * this.width + (cx + dx))) shoreOk = true;\n        }\n      }\n      if (!shoreOk) continue;\n      let ok = true;\n      for (let dy = -1; dy <= 1 && ok; dy++) {\n        for (let dx = -2; dx <= 2; dx++) {\n          if (!inLake(dx, dy)) continue;\n          const t = this.getTile(cx + dx, cy + dy);\n          if (!t || t.object || t.terrain === 'tree' || t.terrain === 'hill') { ok = false; break; }\n        }\n      }\n      if (!ok) continue;\n      for (let dy = -1; dy <= 1; dy++) {\n        for (let dx = -2; dx <= 2; dx++) {\n          if (!inLake(dx, dy)) continue;\n          const t = this.getTile(cx + dx, cy + dy);\n          t.terrain = 'water';\n          t.walkable = false;\n          t.object = null;\n          t.lastEvent = null;\n        }\n      }\n      // 挖掉的源若在被覆盖的源里，移除\n      this.foodSources = this.foodSources.filter(f => this.getTile(f.x, f.y).terrain === 'water' ? false : true);\n      this.foodSources.push({ x: cx, y: cy, amount: cfg.lake.amount, type: 'lake', built: false, buildProgress: 0 });\n      return;\n    }\n  }\n\n  /** 玩家捏地形：delta=+1 抬升 / -1 下挖（沙盘搭建，像搭积木一样增减山体）\n   *  护栏：水面/桥不可改；已有物件（巢穴/巨石/祭坛）不可改；\n   *  资源格（果树/山岗/食物）与巢穴广场（cheb≤4）不可改；等级 0~4 封顶 */\n  editTerrain(x, y, delta) {\n    const t = this.getTile(x, y);\n    if (!t) return { ok: false, msg: '目标超出地图范围，请点地图内部' };\n    if (t.terrain === 'water' || t.terrain === 'bridge' || t.terrain === 'shallow') {\n      return { ok: false, msg: '水路捏不动，试试别处' };\n    }\n    if (t.object) return { ok: false, msg: t.object === 'nest' ? '不能拆自己的家' : '这里已有东西挡着' };\n    if (t.terrain === 'tree' || t.terrain === 'hill' || t.terrain === 'food' || t.terrain === 'crop') {\n      return { ok: false, msg: '生命赖以为系的土地动不得' };\n    }\n    const nest = config.NEST;\n    if (Math.max(Math.abs(x - nest.x), Math.abs(y - nest.y)) <= 4) {\n      return { ok: false, msg: '家园广场是族群的根基，动不得' };\n    }\n    const elevation = require('./elevation');\n    const cur = elevation.levelAt(this, x, y);\n    const next = Math.max(0, Math.min(elevation.MAX_LEVEL, cur + delta));\n    if (next === cur) {\n      return { ok: false, msg: delta > 0 ? '已经捅到天了，再捏不动了' : '已经挖到谷底了' };\n    }\n    this.terrainOverrides[y * this.width + x] = next;\n    this.terrainUndo.push({ x, y, prev: cur });\n    if (this.terrainUndo.length > 30) this.terrainUndo.shift();\n    this.spawnParticles(x, y, 14, delta > 0 ? '#c4a36c' : '#8a6f4d', false);\n    this.log(delta > 0 ? '神力从大地深处隆起一座土丘' : '神手拂过，大地被削平了一块');\n    return { ok: true, msg: delta > 0 ? '⛰️ 地形抬升了' : '⛏️ 地形下挖了' };\n  }\n\n  /** 撤销最近一次捏地形（免费，最多回溯 30 步） */\n  undoTerrainEdit() {\n    const last = (this.terrainUndo || []).pop();\n    if (!last) return { ok: false, msg: '没有可撤销的捏地形操作' };\n    if (last.prev <= 0) delete this.terrainOverrides[last.y * this.width + last.x];\n    else this.terrainOverrides[last.y * this.width + last.x] = last.prev;\n    this.spawnParticles(last.x, last.y, 6, '#9aa4c0', false);\n    this.log('神力回溯，大地恢复了原样');\n    return { ok: true, msg: '↩️ 已撤销一步' };\n  }\n\n  /** 食物自然再生：经济自持，文明不吃空气 */\n  spawnFood() {\n    const active = this.foodSources.filter(f => f.amount > 0).length;\n    if (active >= config.FOOD_REGEN.maxActive) return;\n    const { findPath } = require('../systems/pathfinding');\n    for (let i = 0; i < 60; i++) {\n      const t = this.tiles[randInt(this.tiles.length)];\n      if (!t.walkable || t.object || t.terrain === 'water' || t.terrain === 'crop') continue;\n      if (t.terrain === 'food' && this.foodSources.some(f => f.x === t.x && f.y === t.y)) continue;\n      if (!findPath(this, config.NEST.x, config.NEST.y, t.x, t.y)) continue;\n      const exist = this.foodSources.find(f => f.x === t.x && f.y === t.y);\n      if (exist) {\n        exist.amount = config.FOOD_PER_SOURCE;\n      } else {\n        t.terrain = 'food';\n        t.walkable = true;\n        this.foodSources.push({ x: t.x, y: t.y, amount: config.FOOD_PER_SOURCE, type: 'berry' });\n      }\n      this.log('雨季来临，大地上生长出新的食物');\n      return;\n    }\n  }\n\n  /** 湖心莲籽再熟：桥的攻防价值常驻 */\n  regrowLake() {\n    const lake = this.foodSources.find(f => f.type === 'lake' && f.built && f.amount < 40);\n    if (lake) {\n      lake.amount += 30;\n      this.log('湖心的莲籽又成熟了');\n    }\n  }\n\n  getTile(x, y) {\n    if (x < 0 || y < 0 || x >= this.width || y >= this.height) return null;\n    return this.tiles[y * this.width + x];\n  }\n\n  isWalkable(x, y) {\n    const t = this.getTile(x, y);\n    if (!t || !t.walkable) return false;\n    // 山岗：协作期起才能攀登（文明解锁的地形）\n    if (t.terrain === 'hill' && this.colony.evolutionStage < 2) return false;\n    return true;\n  }\n\n  addEffect(type, x, y, dur) {\n    this.effects.push({ type, x, y, t: 0, dur });\n  }\n\n  spawnParticles(gridX, gridY, count, color, screen) {\n    const pos = require('../utils/iso').gridToScreen(gridX, gridY, config.TILE_SIZE);\n    for (let i = 0; i < count; i++) {\n      this.particles.push({\n        x: pos.x, y: pos.y,\n        vx: (Math.random() - 0.5) * 3,\n        vy: -Math.random() * 3 - 1,\n        life: 1,\n        color,\n        screen\n      });\n    }\n  }\n\n  log(text) {\n    this.colony.eventsLog.unshift({ tick: this.colony.totalTicks, text });\n    if (this.colony.eventsLog.length > 50) this.colony.eventsLog.pop();\n  }\n\n  /** 时光加速 */\n  accelerate(ticks) {\n    this.speedMultUntil = this.colony.totalTicks + ticks;\n  }\n\n  speedMult() {\n    return this.colony.totalTicks < this.speedMultUntil ? 3 : 1;\n  }\n\n  /** 每 tick 推进世界（洪水消退、食物再生等） */\n  tick() {\n    this.colony.totalTicks++;\n\n    // 食物自然再生 + 湖心莲籽再熟\n    if (this.colony.totalTicks % config.FOOD_REGEN.everyTicks === 0) {\n      this.spawnFood();\n    }\n    if (this.colony.totalTicks % (config.FOOD_REGEN.everyTicks / 2) === 0) {\n      this.regrowLake();\n    }\n\n    // 洪水消退\n    for (let i = this.floods.length - 1; i >= 0; i--) {\n      const f = this.floods[i];\n      if (--f.remain <= 0) {\n        f.tiles.forEach(t => {\n          const tile = this.getTile(t.x, t.y);\n          if (tile && tile.terrain === 'water') {\n            tile.terrain = t.prev;\n            tile.walkable = t.prev !== 'water';\n            tile.lastEvent = null;\n          }\n        });\n        this.floods.splice(i, 1);\n      }\n    }\n  }\n}\n\nmodule.exports = World;\n");
__define('systems/ant-system', "/**\n * 小人系统（systems/ant-system.js）\n * 状态机：idle / walking / carrying / fleeing / dead\n * 渲染像素小人由 renderer 负责，这里只管逻辑。\n */\nconst config = require('../data/config');\nconst pf = require('./pathfinding');\n\nlet antSeq = 0;\n\nfunction randInt(n) { return Math.floor(Math.random() * n); }\n\n/** 存档恢复后同步 id 序列，避免新生命 id 冲突 */\nfunction setSeq(n) { if (n > antSeq) antSeq = n; }\n\nclass AntSystem {\n  constructor(world) {\n    this.world = world;\n    this.ants = [];\n  }\n\n  spawnInitial() {\n    const nest = config.NEST;\n    for (let i = 0; i < config.INITIAL_ANTS; i++) {\n      const spot = pf.nearestWalkable(\n        this.world,\n        nest.x + randInt(7) - 3,\n        nest.y + randInt(7) - 3\n      );\n      this.spawnAt(spot.x, spot.y, 1);\n    }\n    this.world.colony.population = this.aliveCount();\n  }\n\n  /** 在指定位置诞生一只小人（繁衍/初始共用） */\n  spawnAt(x, y, generation) {\n    const maxAge = 45000 + randInt(15000);\n    this.ants.push({\n      id: 'ant_' + (++antSeq),\n      x, y,\n      state: 'idle',\n      path: null, pathIdx: 0,\n      targetFood: null,\n      energy: 100,\n      courage: 10 + randInt(60),\n      strength: 20 + randInt(60),\n      carrying: null,\n      carryAmount: 0,\n      fleeTimer: 0,\n      organizeTimer: 0,\n      digTarget: null,\n      stackTimer: 0, stackFood: null,\n      waitTimer: 0, waitFood: null,\n      buildTarget: null,\n      energyComfort: 45 + randInt(30),  // 回巢阈值个体化，错峰回巢\n      age: 0,\n      maxAge,\n      leadership: 0,\n      isLeader: false,\n      generation: generation || 1\n    });\n  }\n\n  aliveCount() {\n    return this.ants.filter(a => a.state !== 'dead').length;\n  }\n\n  tick() {\n    const world = this.world;\n    for (const ant of this.ants) {\n      if (ant.state === 'dead') continue;\n      ant.energy = Math.max(0, ant.energy - 0.03);\n\n      switch (ant.state) {\n        case 'idle': this.decide(ant); break;\n        case 'walking': this.step(ant, () => this.onArriveFood(ant)); break;\n        case 'carrying': this.step(ant, () => this.onArriveNest(ant)); break;\n        case 'fleeing': this.step(ant, () => { ant.state = 'idle'; }); break;\n        case 'digging': this.dig(ant); break;\n        case 'stacking':\n          // 人梯底座：等待同伴攀爬，超时放弃\n          if (--ant.stackTimer <= 0) { ant.state = 'idle'; ant.stackFood = null; }\n          break;\n        case 'waiting':\n          // 山岗下等同伴协作，超时放弃\n          if (--ant.waitTimer <= 0) { ant.state = 'idle'; ant.waitFood = null; }\n          break;\n        case 'building':\n          this.buildWork(ant);\n          break;\n        case 'organizing':\n          // 危机中勇者站出来安抚族群，积累领导力\n          if (--ant.organizeTimer <= 0) { ant.state = 'idle'; ant.leadership += 5; }\n          break;\n        case 'raiding':\n          // 远征中：由 warParty 统一行军，本人在集结点待命\n          ant.energy = Math.max(20, ant.energy);\n          break;\n      }\n    }\n  }\n\n  /** idle 决策：觅食（依次尝试多个源）> 回巢 > 闲逛 */\n  decide(ant) {\n    const world = this.world;\n    // 回巢回血：已在巢穴旁直接恢复（防原地寻路死锁）\n    if (ant.energy < ant.energyComfort) {\n      const d = Math.abs(ant.x - config.NEST.x) + Math.abs(ant.y - config.NEST.y);\n      if (d <= 1) {\n        ant.energy = 100;\n      } else {\n        this.goTo(ant, config.NEST.x, config.NEST.y, 'rest');\n        if (ant.path) { ant.state = 'walking'; ant._arrive = 'nest'; }\n        return;\n      }\n    }\n    // 组织期：未建桥的湖心源 → 专职工匠（最多 2 只），优先于觅食\n    if (world.colony.evolutionStage >= 3) {\n      const lake = world.foodSources.find(f => f.type === 'lake' && !f.built && f.amount > 0);\n      if (lake && (lake.crew || 0) < 2) {\n        const shore = this.findShore(lake);\n        if (shore) {\n          this.goTo(ant, shore.x, shore.y, 'build');\n          if (ant.path) {\n            ant.state = 'walking';\n            ant._arrive = 'build';\n            ant.buildTarget = lake;\n            lake.crew = (lake.crew || 0) + 1;\n            return;\n          }\n        }\n      }\n    }\n    // 觅食：按距离升序最多尝试 4 个源，寻路失败换下一个（防对岸源卡死）\n    const cands = world.foodSources\n      .filter(f => f.amount > 0)\n      .map(f => ({ f, d: Math.abs(f.x - ant.x) + Math.abs(f.y - ant.y) }))\n      .sort((a, b) => a.d - b.d)\n      .slice(0, 3);\n    for (const { f, d } of cands) {\n      if (d > 30) break;\n      this.goTo(ant, f.x, f.y, 'food');\n      if (ant.path) { ant.state = 'walking'; ant.targetFood = f; return; }\n    }\n    // 闲逛/远征：没活干也保持流动，不挤在巢穴\n    if (Math.random() < 0.5) {\n      const range = cands.length ? 8 : 16;\n      const nx = pf.nearestWalkable(world, ant.x + randInt(range * 2 + 1) - range, ant.y + randInt(range * 2 + 1) - range);\n      this.goTo(ant, nx.x, nx.y, 'wander');\n      if (ant.path) { ant.state = 'walking'; ant._arrive = 'wander'; }\n    }\n  }\n\n  /** 找湖心源最近的「可达」岸格（环湖扫描 + 寻路验证，防悬崖挡路） */\n  findShore(lake) {\n    const world = this.world;\n    let best = null, bestD = Infinity;\n    for (const t of world.tiles) {\n      if (!t.walkable || t.object || t.terrain === 'water') continue;\n      const d = Math.max(Math.abs(t.x - lake.x), Math.abs(t.y - lake.y));\n      if (d > 4) continue;  // 限定湖体外圈\n      // 必须与湖体相邻（真正的岸）\n      const adjWater = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {\n        const nb = world.getTile(t.x + dx, t.y + dy);\n        return nb && nb.terrain === 'water';\n      });\n      if (!adjWater) continue;\n      const dist = Math.abs(t.x - config.NEST.x) + Math.abs(t.y - config.NEST.y);\n      if (dist < bestD && pf.findPath(world, config.NEST.x, config.NEST.y, t.x, t.y)) {\n        best = { x: t.x, y: t.y };\n        bestD = dist;\n      }\n    }\n    return best;\n  }\n\n  goTo(ant, tx, ty, tag) {\n    const path = pf.findPath(this.world, Math.round(ant.x), Math.round(ant.y), tx, ty);\n    if (path && path.length > 0) {\n      ant.path = path;\n      ant.pathIdx = 0;\n      ant._arrive = tag;\n    } else {\n      ant.path = null;\n    }\n  }\n\n  /** 沿路径移动一步 */\n  step(ant, onArrive) {\n    if (!ant.path || ant.pathIdx >= ant.path.length) {\n      onArrive();\n      return;\n    }\n    const node = ant.path[ant.pathIdx];\n    const speed = config.ANT_SPEED * (0.7 + ant.strength / 200);\n    const dx = node.x - ant.x, dy = node.y - ant.y;\n    const dist = Math.abs(dx) + Math.abs(dy);\n    if (dist <= speed) {\n      ant.x = node.x; ant.y = node.y;\n      ant.pathIdx++;\n      if (ant.pathIdx >= ant.path.length) { ant.path = null; onArrive(); }\n    } else {\n      ant.x += Math.sign(dx) * Math.min(speed, Math.abs(dx));\n      ant.y += Math.sign(dy) * Math.min(speed, Math.abs(dy));\n    }\n  }\n\n  onArriveFood(ant) {\n    if (ant._arrive === 'dig') { ant.state = 'digging'; return; }\n    if (ant._arrive === 'build') { ant.state = 'building'; return; }\n    if (ant._arrive === 'nest') { ant.energy = 100; ant.state = 'idle'; return; }\n    if (ant._arrive === 'wander') { ant.state = 'idle'; return; }\n\n    // 特殊资源开采（文明的招牌考题）\n    const f = ant.targetFood;\n    if (f && f.amount > 0) {\n      if (f.type === 'tree') {\n        // 树冠果实：需要人梯底座，有人梯才能攀爬采 3 份\n        const stacker = this.ants.find(x =>\n          x !== ant && x.state === 'stacking' && x.stackFood === f &&\n          Math.abs(x.x - f.x) + Math.abs(x.y - f.y) <= 1);\n        if (!stacker) {\n          ant.state = 'stacking';\n          ant.stackTimer = config.SPECIAL_FOOD.tree.stackTicks;\n          ant.stackFood = f;\n          ant.path = null;\n          this.world.log(`${ant.id} 趴在树下当人梯，等同伴踩着它的背`);\n          return;\n        }\n        this.startCarry(ant, f, config.SPECIAL_FOOD.tree.yield);\n        return;\n      }\n      if (f.type === 'hill') {\n        // 山岗岩蜜：双人协作，单人原地等待\n        const mate = this.ants.find(x =>\n          x !== ant && x.state !== 'dead' && x.state !== 'carrying' &&\n          Math.abs(x.x - f.x) + Math.abs(x.y - f.y) <= 1);\n        if (mate) {\n          if (mate.state === 'waiting') { mate.state = 'idle'; mate.waitFood = null; }\n          this.startCarry(ant, f, 1);\n          if (mate.state === 'idle' && mate.carrying !== 'food') this.startCarry(mate, f, 1);\n          this.world.log(`${ant.id} 和同伴合力，把岩蜜从山岗上抬了下来`);\n        } else {\n          ant.state = 'waiting';\n          ant.waitTimer = 400;\n          ant.waitFood = f;\n          ant.path = null;\n          this.world.log(`${ant.id} 一只搬不动山岗上的岩蜜，原地等待同伴`);\n        }\n        return;\n      }\n      // 普通源（协作期起单次搬运量翻倍）\n      const cap = this.world.colony.evolutionStage >= 2 ? 2 : 1;\n      this.startCarry(ant, f, Math.min(cap, f.amount));\n      return;\n    }\n    ant.state = 'idle';\n  }\n\n  /** 开始搬运：装货 + 回巢 */\n  startCarry(ant, f, n) {\n    ant.carryAmount = Math.min(n, f.amount);\n    f.amount -= ant.carryAmount;\n    ant.carrying = 'food';\n    ant.state = 'carrying';\n    ant.targetFood = null;\n    this.goTo(ant, config.NEST.x, config.NEST.y, 'nest');\n    ant._arrive = 'nest';\n  }\n\n  /** 造桥施工：进度攒满即搭出芦苇桥 */\n  buildWork(ant) {\n    const f = ant.buildTarget;\n    if (!f || f.built || f.amount <= 0) {\n      ant.state = 'idle';\n      ant.buildTarget = null;\n      if (f) f.crew = Math.max(0, (f.crew || 0) - 1);\n      return;\n    }\n    f.buildProgress++;\n    if (Math.random() < 0.05) {\n      this.world.spawnParticles(f.x, f.y, 1, config.PALETTE.particle_dust, true);\n    }\n    if (f.buildProgress >= config.SPECIAL_FOOD.lake.buildTicks) {\n      this.buildBridge(f);\n      for (const a2 of this.ants) {\n        if (a2.state === 'building') { a2.state = 'idle'; a2.buildTarget = null; }\n      }\n    }\n  }\n\n  /** 释放造桥名额（被吓/死亡时防 crew 泄漏） */\n  releaseCrew(ant) {\n    if (ant.buildTarget) {\n      ant.buildTarget.crew = Math.max(0, (ant.buildTarget.crew || 0) - 1);\n      ant.buildTarget = null;\n    }\n  }\n\n  /** 沿源格到巢穴方向把水格铺成芦苇桥 */\n  buildBridge(f) {\n    const world = this.world;\n    let x = f.x, y = f.y;\n    let laid = 0;\n    while (laid++ < 12) {\n      const t = world.getTile(x, y);\n      if (!t) break;\n      if (t.terrain === 'water') {\n        t.terrain = 'bridge';\n        t.walkable = true;\n      }\n      if (x === f.x && y === f.y) { /* 源格已铺 */ }\n      const dx = Math.sign(config.NEST.x - x);\n      const dy = Math.sign(config.NEST.y - y);\n      if (dx === 0 && dy === 0) break;\n      if (dx !== 0 && (dy === 0 || Math.abs(config.NEST.x - x) >= Math.abs(config.NEST.y - y))) x += dx;\n      else y += dy;\n      const nt = world.getTile(x, y);\n      if (nt && nt.terrain !== 'water') break; // 到岸\n    }\n    f.built = true;\n    f.buildProgress = 0;\n    f.crew = 0;\n    world.log('小人们用芦苇搭起一座桥，通向湖心的莲籽');\n  }\n\n  onArriveNest(ant) {\n    const colony = this.world.colony;\n    if (ant.carrying === 'food') {\n      colony.totalFood += ant.carryAmount;\n      colony.carriedTotal += ant.carryAmount;\n      ant.carrying = null;\n      ant.carryAmount = 0;\n    }\n    ant.energy = Math.min(100, ant.energy + 60);\n    ant.state = 'idle';\n  }\n\n  /** 指派勇者折返挖掘巨石（可见的解题行为）；返回成功指派数 */\n  assignDigger(rockX, rockY, count) {\n    // 巨石旁的可站立格：只保留巢穴可达的（身高规则下，走不到的位置没法挖）\n    const spots = [];\n    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1], [1, 1], [-1, -1]]) {\n      const t = pf.nearestWalkable(this.world, rockX + dx, rockY + dy);\n      if (Math.abs(t.x - rockX) + Math.abs(t.y - rockY) <= 2) spots.push(t);\n    }\n    const okSpots = spots.filter(t =>\n      pf.findPath(this.world, config.NEST.x, config.NEST.y, t.x, t.y));\n    if (okSpots.length === 0) return 0;\n\n    const candidates = this.ants\n      .filter(a => a.state !== 'dead' && a.state !== 'digging')\n      .sort((a, b) => b.courage - a.courage);\n    let assigned = 0;\n    for (const ant of candidates) {\n      if (assigned >= count) break;\n      // 依次尝试各 spot：第一个寻路失败就换下一个，不死磕同一个点\n      for (let i = 0; i < okSpots.length && ant.path === null; i++) {\n        const spot = okSpots[(assigned + i) % okSpots.length];\n        this.goTo(ant, spot.x, spot.y, 'dig');\n        if (ant.path) {\n          ant.state = 'walking';\n          ant.digTarget = { x: rockX, y: rockY };\n          assigned++;\n        }\n      }\n    }\n    return assigned;\n  }\n\n  /** 挖掘：每 tick 削减巨石耐久，挖穿即清除并触发回调 */\n  dig(ant) {\n    const t = this.world.getTile(ant.digTarget.x, ant.digTarget.y);\n    if (!t || t.object !== 'rock' || t.rockHp === undefined) {\n      ant.state = 'idle';\n      ant.digTarget = null;\n      return;\n    }\n    const lvl = this.world.colony.counterLevels.rock || 0;\n    const power = config.ROCK.digPowerBase + ant.strength / 300 + lvl * config.ROCK.digPerCounterLevel;\n    t.rockHp -= power;\n    // 挖掘尘土\n    if (Math.random() < 0.06) {\n      this.world.spawnParticles(ant.digTarget.x, ant.digTarget.y, 2, config.PALETTE.particle_dust, true);\n    }\n    if (t.rockHp <= 0) {\n      t.object = null;\n      t.walkable = true;\n      t.clearedBy = 'ants';\n      t.rockHp = undefined;\n      t.rockMaxHp = undefined;\n      if (this.onRockCleared) this.onRockCleared(t);\n      this.world.log(`${ant.id} 带头搬开了 (${t.x}, ${t.y}) 的巨石，道路重新畅通`);\n      for (const a2 of this.ants) {\n        if (a2.state === 'digging') { a2.state = 'idle'; a2.digTarget = null; }\n      }\n    }\n  }\n\n  /** 触发逃离（干预系统调用）：勇者留下组织，其余逃离 */\n  scare(cx, cy, radius) {\n    const stage = this.world.colony.evolutionStage;\n    // 找范围内勇气最高的勇者（协作期起才出现组织行为）\n    let brave = null;\n    if (stage >= 2) {\n      for (const ant of this.ants) {\n        if (ant.state === 'dead' || ant.state === 'organizing') continue;\n        const d = Math.abs(ant.x - cx) + Math.abs(ant.y - cy);\n        if (d <= radius && ant.courage >= 55 && (!brave || ant.courage > brave.courage)) brave = ant;\n      }\n    }\n    if (brave) {\n      brave.state = 'organizing';\n      brave.organizeTimer = 200;\n      brave.path = null;\n    }\n    for (const ant of this.ants) {\n      if (ant.state === 'dead' || ant.state === 'raiding' || ant === brave) continue;\n      const d = Math.abs(ant.x - cx) + Math.abs(ant.y - cy);\n      if (d <= radius) {\n        this.releaseCrew(ant);\n        const dx = ant.x - cx, dy = ant.y - cy;\n        const tx = pf.nearestWalkable(this.world, ant.x + Math.sign(dx || 1) * 6, ant.y + Math.sign(dy || 1) * 6);\n        this.goTo(ant, tx.x, tx.y, 'flee');\n        if (ant.path) { ant.state = 'fleeing'; }\n      }\n    }\n  }\n\n  /** 飓风：所有小人被吹散到随机位置，掉落携带物 */\n  scatterByWind() {\n    for (const ant of this.ants) {\n      if (ant.state === 'dead' || ant.state === 'raiding') continue;\n      this.releaseCrew(ant);\n      const spot = pf.nearestWalkable(this.world, randInt(this.world.width), randInt(this.world.height));\n      ant.x = spot.x; ant.y = spot.y;\n      ant.path = null;\n      if (ant.carrying) {\n        ant.carrying = null;\n        ant.carryAmount = 0;\n      }\n      ant.state = 'idle';\n    }\n  }\n\n  /** 巨石落点直接命中致死（onDeath 钩子由进化系统接管领袖葬礼逻辑） */\n  crushAt(x, y, radius) {\n    let killed = 0;\n    for (const ant of this.ants) {\n      if (ant.state === 'dead' || ant.state === 'raiding') continue;\n      if (Math.abs(ant.x - x) <= radius && Math.abs(ant.y - y) <= radius) {\n        ant.state = 'dead';\n        killed++;\n        if (this.onDeath) this.onDeath(ant, '被巨石砸中');\n      }\n    }\n    this.world.colony.population = this.aliveCount();\n    return killed;\n  }\n}\n\nAntSystem.setSeq = setSeq;\n\nmodule.exports = AntSystem;\n");
__define('systems/intervention-system', "/**\n * 干预系统（systems/intervention-system.js）\n * 免费干预：巨石 / 洪水 / 飓风\n * 广告干预：神粮（开发阶段用模拟弹窗代替真实广告位）\n * 规则：每分钟最多 3 次，同类间隔 10 秒\n */\nconst config = require('../data/config');\nconst pf = require('./pathfinding');\nconst elevation = require('../game-engine/elevation');\nconst { ensureRival } = require('../game-engine/rival-tribe');\n\nconst TYPES = {\n  raise: { name: '造山',     icon: '⛰️', adReward: false },\n  lower: { name: '铲平',     icon: '⛏️', adReward: false },\n  raid:  { name: '掠夺',     icon: '⚔️', adReward: false },\n  rock:  { name: '天降巨石', icon: '🪨', adReward: false },\n  flood: { name: '洪水',     icon: '🌊', adReward: false },\n  wind:  { name: '飓风',     icon: '🌪️', adReward: false },\n  food:  { name: '天降神粮', icon: '🍞', adReward: true },\n  remove:{ name: '神之手',   icon: '✋', adReward: true },\n  accelerate: { name: '时光加速', icon: '⏩', adReward: true }\n};\n\nclass InterventionSystem {\n  constructor(world, ants) {\n    this.world = world;\n    this.ants = ants;\n    this.history = [];             // 最近干预时间戳\n    this.lastByType = {};          // 同类冷却\n    this.lastByTile = {};          // 捏地形：同格冷却 \"type:x,y\" -> 时间戳\n  }\n\n  /** 是否可用；返回 null=可用，否则返回人话原因 */\n  checkAvailable(type) {\n    const now = Date.now();\n    const rules = config.INTERVENTION_RULES;\n    const recent = this.history.filter(t => now - t < 60000);\n    if (recent.length >= rules.maxPerMinute) {\n      return `干预太频繁，每分钟最多 ${rules.maxPerMinute} 次，歇一歇`;\n    }\n    const last = this.lastByType[type];\n    if (last && now - last < rules.cooldownBetweenSame) {\n      const wait = Math.ceil((rules.cooldownBetweenSame - (now - last)) / 1000);\n      return `${TYPES[type].name}冷却中，还需 ${wait} 秒`;\n    }\n    return null;\n  }\n\n  /** 对格子执行干预；返回 {ok, msg} */\n  execute(type, x, y) {\n    // 捏地形（沙盘搭建）：同格冷却 + 跨格轻节流，不吃每分钟 3 次全局限制，但每格耗粮\n    if (type === 'raise' || type === 'lower') {\n      if (!this.world.getTile(x, y)) return { ok: false, msg: '目标超出地图范围，请点地图内部' };\n      const now = Date.now();\n      const throttle = this.lastByType[type];\n      if (throttle && now - throttle < 100) {\n        return { ok: false, msg: '捉得太快了，缓一拍' };\n      }\n      const tileKey = type + ':' + x + ',' + y;\n      const last = this.lastByTile[tileKey];\n      if (last && now - last < config.TERRAIN_EDIT.cooldownMs) {\n        return { ok: false, msg: '这块刚捏过，缓一拍' };\n      }\n      const result = type === 'raise' ? this.doRaise(x, y) : this.doLower(x, y);\n      if (result.ok) {\n        this.lastByType[type] = now;\n        this.lastByTile[tileKey] = now;\n        this.world.colony.totalInterventions++;\n      }\n      return result;\n    }\n\n    const reason = this.checkAvailable(type);\n    if (reason) return { ok: false, msg: reason };\n\n    // 飓风/加速是全局效果，不需要目标格子\n    let result;\n    if (type === 'wind') {\n      result = this.doWind();\n    } else if (type === 'accelerate') {\n      result = this.doAccelerate();\n    } else {\n      if (!this.world.getTile(x, y)) return { ok: false, msg: '目标超出地图范围，请点地图内部' };\n      switch (type) {\n        case 'rock': result = this.doRock(x, y); break;\n        case 'flood': result = this.doFlood(x, y); break;\n        case 'food': result = this.doFood(x, y); break;\n        case 'remove': result = this.doRemove(x, y); break;\n        case 'raid': result = this.doRaid(x, y); break;\n        default: return { ok: false, msg: '未知的干预类型' };\n      }\n    }\n\n    if (result.ok) {\n      const now = Date.now();\n      this.history.push(now);\n      this.lastByType[type] = now;\n      this.world.colony.totalInterventions++;\n    }\n    return result;\n  }\n\n  /** 目标格本体或四邻是否可从巢穴抵达（含身高规则） */\n  reachableFromNest(world, x, y) {\n    const nest = config.NEST;\n    return [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {\n      const t = world.getTile(x + dx, y + dy);\n      return t && t.walkable && pf.findPath(world, nest.x, nest.y, x + dx, y + dy);\n    });\n  }\n\n  /** 从巢穴 BFS 求可达集，返回离 (x,y) 最近的可达无物格\n   *  needDigSpot=true 时优先选「存在可达可站立邻格」的落点（巨石要有人能贴身挖，否则考验无解） */\n  nearestReachable(world, x, y, needDigSpot = false) {\n    const nest = config.NEST;\n    const W = world.width, H = world.height;\n    const seen = new Set([nest.y * W + nest.x]);\n    const queue = [[nest.x, nest.y]];\n    const cands = [];\n    while (queue.length) {\n      const [cx, cy] = queue.shift();\n      const ct = world.getTile(cx, cy);\n      const d = Math.abs(cx - x) + Math.abs(cy - y);\n      if (ct && ct.walkable && !ct.object && !(cx === nest.x && cy === nest.y)) {\n        cands.push({ x: cx, y: cy, d });\n      }\n      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {\n        const nx = cx + dx, ny = cy + dy, k = ny * W + nx;\n        if (nx < 0 || ny < 0 || nx >= W || ny >= H || seen.has(k)) continue;\n        const nt = world.getTile(nx, ny);\n        if (!nt || !nt.walkable || !elevation.canTraverse(world, cx, cy, nx, ny)) continue;\n        seen.add(k);\n        queue.push([nx, ny]);\n      }\n    }\n    if (!cands.length) return null;\n    if (needDigSpot) {\n      const withSpot = cands.filter(c =>\n        [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {\n          const nb = world.getTile(c.x + dx, c.y + dy);\n          return nb && nb.walkable && !nb.object && seen.has((c.y + dy) * W + (c.x + dx));\n        }));\n      if (withSpot.length) {\n        withSpot.sort((a, b) => a.d - b.d);\n        return withSpot[0];\n      }\n    }\n    cands.sort((a, b) => a.d - b.d);\n    return cands[0];\n  }\n\n  /** 造山/铲平：神力搭建，每格消耗粮食；改写处小人脚下旧路径立即作废重算 */\n  doRaise(x, y) {\n    const world = this.world;\n    const cost = config.TERRAIN_EDIT.cost;\n    if (world.colony.totalFood < cost) {\n      return { ok: false, msg: `神力不足，捏地形每格需 ${cost} 粮食` };\n    }\n    const before = this.routeCost();\n    const r = world.editTerrain(x, y, 1);\n    if (r.ok) { world.colony.totalFood -= cost; this.invalidatePaths(x, y); this.routeFeedback(before); }\n    return r;\n  }\n\n  doLower(x, y) {\n    const world = this.world;\n    const cost = config.TERRAIN_EDIT.cost;\n    if (world.colony.totalFood < cost) {\n      return { ok: false, msg: `神力不足，捏地形每格需 ${cost} 粮食` };\n    }\n    const before = this.routeCost();\n    const r = world.editTerrain(x, y, -1);\n    if (r.ok) { world.colony.totalFood -= cost; this.invalidatePaths(x, y); this.routeFeedback(before); }\n    return r;\n  }\n\n  /** 当前巢穴→最近活跃食物源的路长（无路=Infinity） */\n  routeCost() {\n    const world = this.world;\n    let best = Infinity;\n    for (const f of world.foodSources) {\n      if (f.amount <= 0) continue;\n      const p = pf.findPath(world, config.NEST.x, config.NEST.y, f.x, f.y);\n      if (p && p.length < best) best = p.length;\n    }\n    return best;\n  }\n\n  /** 捏地形后路变短了 → 播报捷径（让修路有可感知的战略收益） */\n  routeFeedback(before) {\n    if (before === Infinity) return;\n    const after = this.routeCost();\n    if (after < before - 2) {\n      this.world.log(`族人发现了一条捷径，搬运少走 ${before - after} 步`);\n    }\n  }\n\n  /** 被改写的格子在小人路径上 → 作废重算，避免穿新山 */\n  invalidatePaths(x, y) {\n    (this.ants.ants || []).forEach(a => {\n      if (a.path && a.path.some(p => p.x === x && p.y === y)) a.path = null;\n    });\n  }\n\n  /** ⚔️ 掠夺：组织远征队跨浅滩攻打对岸黑岩部落\n   *  解锁：协作期，或存粮跌破枯竭线；目标：敌方巢穴附近；消耗远征粮草 */\n  doRaid(x, y) {\n    const world = this.world;\n    const r = world.rival;\n    if (!r) { ensureRival(world); return { ok: false, msg: '对岸还一片沉寂，稍后再来' }; }\n    if (r.mood === 'subjugated') return { ok: false, msg: `${r.name}已经臣服朝贡，不必再打` };\n    if (r.mood === 'dormant') return { ok: false, msg: '对岸目前风平浪静，等双方照面后再说' };\n    const stage = world.colony.evolutionStage;\n    const cfg = config.RIVAL;\n    if (stage < cfg.raidUnlockStage && world.colony.totalFood >= cfg.raidUnlockFood) {\n      return { ok: false, msg: `部落还没有远征的能力：协作期解锁，或存粮跌破 ${cfg.raidUnlockFood}（资源枯竭逼出求生之战）` };\n    }\n    // 目标：敌巢附近，或对岸农田（烧田断其经济）\n    const isCrop = (world.rivalCrops || []).some(cp => cp.x === x && cp.y === y && cp.amount > 0);\n    const nearNest = Math.max(Math.abs(x - r.x), Math.abs(y - r.y)) <= 2;\n    if (!nearNest && !isCrop) {\n      return { ok: false, msg: '要打就对准黑岩部落的巢穴或他们的庄稼' };\n    }\n    if (world.warParties.some(p => p.side === 'player')) {\n      return { ok: false, msg: '远征队还在路上，等他们回来' };\n    }\n    const alive = this.ants.ants.filter(a => a.state !== 'dead' && a.state !== 'raiding');\n    if (alive.length < cfg.partySize + 4) {\n      return { ok: false, msg: `人手不足：至少留 ${4} 只看家，才能凑出 ${cfg.partySize} 人远征队` };\n    }\n    if (world.colony.totalFood < cfg.partyFood) {\n      return { ok: false, msg: `连远征的粮草都凑不出了（需 ${cfg.partyFood} 粮食）` };\n    }\n    // 行军路线：必须能跨过浅滩走到敌巢附近\n    const path = pf.findPath(world, config.NEST.x, config.NEST.y, r.x, r.y, 1);\n    if (!path) return { ok: false, msg: '找不到通往对岸的路线，先派斥候探探渡口' };\n    // 组队：勇气最高者领军\n    const members = alive.sort((a, b) => b.courage - a.courage).slice(0, cfg.partySize);\n    for (const m of members) { m.state = 'raiding'; m.path = null; }\n    world.colony.totalFood -= cfg.partyFood;\n    world.warParties.push({\n      side: 'player',\n      x: config.NEST.x, y: config.NEST.y,\n      path, pathIdx: 0,\n      members: members.map(m => m.id),\n      size: members.length,\n      target: isCrop ? { kind: 'crop', x, y } : { kind: 'nest', x: r.x, y: r.y }\n    });\n    world.log(isCrop\n      ? `🚩 ${members.length} 名勇士组成远征队，悄悄摸向 ${r.name}的庄稼地！`\n      : `🚩 ${members.length} 名勇士组成远征队，浩浩荡荡杀向 ${r.name}！`);\n    return { ok: true, msg: isCrop ? `🌾 抢收队出发（${members.length} 人）` : `⚔️ 远征队出发（${members.length} 人，战力 ${Math.round(members.reduce((s, a) => s + a.strength * 0.5 + a.courage * 0.3, 0) + stage * 10)}）` };\n  }\n\n  doRock(x, y) {\n    const world = this.world;\n    const colony = world.colony;\n    let tile = world.getTile(x, y);\n    if (tile.object === 'nest') return { ok: false, msg: '不能砸自己的巢穴' };\n\n    // 身高规则：落在族群上不去的高台会让考验无解 → 巨石自动滚落到可达处\n    if (tile.terrain !== 'bridge' && !this.reachableFromNest(world, x, y)) {\n      const spot = this.nearestReachable(world, x, y, true);\n      if (spot) {\n        world.log('巨石撞上绝壁，滚落到了族群能够抵达的坡地');\n        x = spot.x; y = spot.y;\n        tile = world.getTile(x, y);\n      }\n    }\n\n    // 砸芦苇桥：断一段整桥塌，战术打击不登记考验\n    if (tile.terrain === 'bridge') {\n      let broke = 0;\n      for (const t of world.tiles) {\n        if (t.terrain === 'bridge') {\n          t.terrain = 'water';\n          t.walkable = false;\n          broke++;\n        }\n      }\n      const lake = world.foodSources.find(f => f.type === 'lake' && f.built);\n      if (lake) { lake.built = false; lake.buildProgress = 0; }\n      world.addEffect('rock_fall', x, y, 600);\n      world.spawnParticles(x, y, 10, config.PALETTE.particle_dust, true);\n      this.ants.scare(x, y, 4);\n      world.log(`巨石砸断了芦苇桥（${broke} 段），湖心莲籽重新遥不可及`);\n      return { ok: true, msg: '芦苇桥被砸断，它们得重新造' };\n    }\n\n    tile.object = 'rock';\n    tile.walkable = false;\n    tile.lastEvent = 'earthquake';\n    tile.clearedBy = null;\n\n    // 强度随文明阶段升级，破解抗性削弱\n    const stage = colony.evolutionStage;\n    const lvl = colony.counterLevels.rock || 0;\n    const killR = Math.max(0, Math.min(config.STRENGTH.rockKillMax, Math.floor(stage / config.STRENGTH.rockKillPerStage)) - Math.floor(lvl / 2));\n    const scareR = Math.max(2, 3 + Math.floor(stage / config.STRENGTH.rockScarePerStage) - lvl);\n\n    // 巨石耐久：阶段越高越硬；小人可挖掘搬开（可见的解题行为）\n    tile.rockMaxHp = config.ROCK.baseHp + stage * config.ROCK.hpPerStage;\n    tile.rockHp = tile.rockMaxHp;\n\n    const killed = this.ants.crushAt(x, y, killR);\n    this.ants.scare(x, y, scareR);\n    const diggers = this.ants.assignDigger(\n      x, y,\n      Math.min(config.ROCK.diggersMax, config.ROCK.diggersBase + Math.floor(stage / 2))\n    );\n\n    // 特效：落石 + 尘土\n    world.addEffect('rock_fall', x, y, 600);\n    world.spawnParticles(x, y, 14, config.PALETTE.particle_dust, true);\n\n    colony.eventHistory.earthquake++;\n    world.log(`天降巨石砸落在 (${x}, ${y})` + (killed ? `，${killed} 只小人罹难` : ''));\n    if (this.onDisaster) {\n      this.onDisaster({ type: 'rock', x, y, scareRadius: scareR, killRadius: killR });\n    }\n    return {\n      ok: true,\n      msg: (killed ? `巨石落下，${killed} 只小人罹难` : '巨石落下，小人们惊恐逃散')\n        + (diggers > 0 ? `，${diggers} 只勇者折返搬石` : '')\n        + (lvl > 0 ? `（抗性 Lv.${lvl}）` : '')\n    };\n  }\n\n  doFlood(x, y) {\n    const world = this.world;\n    const colony = world.colony;\n    const stage = colony.evolutionStage;\n    const lvl = colony.counterLevels.flood || 0;\n    const R = Math.min(config.STRENGTH.floodRadiusMax, 1 + Math.floor(stage / config.STRENGTH.floodRadiusPerStage));\n    const duration = Math.round(\n      (config.FLOOD_DURATION + stage * config.STRENGTH.floodDurPerStage)\n      * Math.max(0.4, 1 - lvl * 0.12)\n    );\n    const scareR = 4 + Math.floor(stage / 3);\n\n    const tiles = [];\n    const centerLvl = elevation.levelAt(world, x, y);\n    let blocked = 0;\n    for (let dy = -R; dy <= R; dy++) {\n      for (let dx = -R; dx <= R; dx++) {\n        const t = world.getTile(x + dx, y + dy);\n        if (!t || t.terrain === 'water' || t.object === 'nest') continue;\n        // 水往低处流：爬不上比落水点高 2 级以上的高坡（玩家修的堤坝能挡洪）\n        if (elevation.levelAt(world, t.x, t.y) > centerLvl + 1) { blocked++; continue; }\n        tiles.push({ x: t.x, y: t.y, prev: t.terrain });\n        t.terrain = 'water';\n        t.walkable = false;\n        t.lastEvent = 'flood';\n      }\n    }\n    if (tiles.length === 0) {\n      return { ok: false, msg: blocked > 0 ? '洪水被高坡全拦住了，漫不上去' : '这里已经是水面了' };\n    }\n\n    world.floods.push({ tiles, remain: duration });\n    this.ants.scare(x, y, scareR);\n    world.addEffect('flood_wave', x, y, 800);\n    world.spawnParticles(x, y, 12, config.PALETTE.particle_water, true);\n\n    colony.eventHistory.flood++;\n    world.log(blocked > 0\n      ? `洪水淹没了 (${x}, ${y}) 附近区域，但 ${blocked} 格高坡拦住了水头`\n      : `洪水淹没了 (${x}, ${y}) 附近区域`);\n    if (this.onDisaster) {\n      this.onDisaster({ type: 'flood', x, y, scareRadius: scareR, durationTicks: duration });\n    }\n    return { ok: true, msg: blocked > 0\n      ? `洪水漫过部分区域，${blocked} 格高坡挡住了水头`\n      : `洪水漫过 ${R * 2 + 1}×${R * 2 + 1} 区域，小人们向高处逃亡` };\n  }\n\n  doWind() {\n    const world = this.world;\n    this.ants.scatterByWind();\n    // 高阶文明风势更猛：吹散后体力受损（抗性可减免）\n    const stage = world.colony.evolutionStage;\n    const lvl = world.colony.counterLevels.wind || 0;\n    const drain = Math.max(0, stage * 4 - lvl * 3);\n    if (drain > 0) {\n      for (const ant of this.ants.ants) {\n        if (ant.state !== 'dead') ant.energy = Math.max(1, ant.energy - drain);\n      }\n    }\n    world.addEffect('wind_storm', world.width / 2, world.height / 2, 900);\n    world.colony.eventHistory.wind++;\n    world.log('一场飓风席卷全境，所有小人被吹散');\n    if (this.onDisaster) {\n      this.onDisaster({ type: 'wind' });\n    }\n    return { ok: true, msg: '飓风过境，小人们被吹得七零八落' };\n  }\n\n  /** 神之手：移除指定格子的障碍物（巨石） */\n  doRemove(x, y) {\n    const tile = this.world.getTile(x, y);\n    if (tile.object !== 'rock') {\n      return { ok: false, msg: tile.object ? '这个无法移除' : '这里没有障碍物，神之手落空了' };\n    }\n    tile.object = null;\n    tile.walkable = true;\n    tile.lastEvent = 'miracle';\n    tile.clearedBy = 'hand';\n    this.world.spawnParticles(x, y, 8, config.PALETTE.particle_wind, true);\n    this.world.colony.eventHistory.miracle++;\n    this.world.log(`神之手抹去了 (${x}, ${y}) 的巨石，小人们目瞪口呆`);\n    return { ok: true, msg: '巨石被神之手抹去，道路重新畅通' };\n  }\n\n  /** 时光加速：游戏速度 ×3，持续 300 tick */\n  doAccelerate() {\n    this.world.accelerate(config.ACCEL_TICKS);\n    this.world.addEffect('blessing', this.world.width / 2, this.world.height / 2, 600);\n    this.world.log('时间之河流速加快，文明以三倍脚步奔涌向前');\n    return { ok: true, msg: '时光加速 ×3，持续 15 秒' };\n  }\n\n  doFood(x, y) {\n    const world = this.world;\n    const tile = world.getTile(x, y);\n    if (tile.terrain === 'water') return { ok: false, msg: '神粮不能落在水里，换个位置' };\n    if (tile.terrain === 'food') return { ok: false, msg: '这里已经有食物了' };\n\n    tile.terrain = 'food';\n    tile.lastEvent = 'blessing';\n    world.foodSources.push({ x, y, amount: config.FOOD_PER_SOURCE * 2 });\n    world.addEffect('blessing', x, y, 900);\n    world.spawnParticles(x, y, 16, config.PALETTE.particle_blessing, true);\n\n    world.colony.eventHistory.blessing++;\n    world.log(`神粮降临 (${x}, ${y})，小人们欢呼雀跃`);\n    return { ok: true, msg: '神粮从天而降，小人们蜂拥而至' };\n  }\n}\n\nmodule.exports = { InterventionSystem, TYPES };\n");
__define('systems/evolution-system', "/**\n * 进化系统（systems/evolution-system.js）—— 阶段四核心\n * 职责：进化进度/晋升、繁衍、寿命与死亡、领袖选举与传承、祭坛赐福\n */\nconst config = require('../data/config');\n\nconst STAGES = config.EVOLUTION_STAGES;\nconst RULES = config.EVOLUTION_RULES;\n\nfunction randInt(n) { return Math.floor(Math.random() * n); }\n\nclass EvolutionSystem {\n  constructor(world, ants) {\n    this.world = world;\n    this.ants = ants;\n    // 小人挖开巨石 → 巨石挑战当场判成功\n    ants.onRockCleared = (tile) => {\n      const ch = world.colony.activeChallenge;\n      if (ch && ch.type === 'rock' && ch.kind === 'dig') {\n        this.resolveChallenge(true, `巨石被搬开`);\n      }\n    };\n  }\n\n  tick() {\n    const colony = this.world.colony;\n    this.updateAging();\n    this.updateBirths();\n    this.updateFaith();\n    this.updateChallenge();\n    this.updateProgress();\n    this.updateLeader();\n    // 混乱期结束提示\n    if (colony.mourningUntil && colony.totalTicks === colony.mourningUntil) {\n      this.world.log('族群从哀悼中走出，一切重新开始');\n      colony.mourningUntil = 0;\n    }\n    // 文明灭亡\n    if (!colony.ended && colony.population <= 0 && colony.totalTicks > 100) {\n      colony.ended = true;\n      this.world.log('【文明终结】最后一个小人倒下了，这段历史画上句号');\n    }\n  }\n\n  // ---------- 对抗循环：玩家出题，小人解题 ----------\n\n  /**\n   * 玩家灾难落地后登记挑战（intervention-system 回调）\n   * detail: { type, x, y, scareRadius, durationTicks }\n   */\n  onDisaster(detail) {\n    const colony = this.world.colony;\n    if (colony.ended) return;\n    const CH = config.CHALLENGE;\n    const type = detail.type;\n    const stage = colony.evolutionStage;\n    const t = colony.totalTicks;\n\n    if (type === 'rock') {\n      colony.activeChallenge = {\n        type: 'rock',\n        kind: 'dig',\n        rockX: detail.x,\n        rockY: detail.y,\n        goal: 1,\n        progress: 0,\n        deadline: t + CH.rock.windowTicks\n      };\n      this.world.log(`考验降临：族群要在 ${Math.round(CH.rock.windowTicks * config.TICK_MS / 1000)} 秒内搬开这块巨石`);\n    } else if (type === 'wind') {\n      const rule = CH.wind;\n      const goal = rule.baseGoal + rule.goalPerStage * stage;\n      colony.activeChallenge = {\n        type,\n        kind: 'carry',\n        goal,\n        carriedAt: colony.carriedTotal,\n        progress: 0,\n        deadline: t + rule.windowTicks\n      };\n      this.world.log(`考验降临：飓风过后搬回 ${goal} 份食物，证明族群能重新站起`);\n    } else if (type === 'flood') {\n      // 统计恐慌半径内的小人，要求 N% 活到洪水消退\n      const ids = [];\n      for (const ant of this.ants.ants) {\n        if (ant.state === 'dead') continue;\n        if (Math.abs(ant.x - detail.x) + Math.abs(ant.y - detail.y) <= detail.scareRadius) ids.push(ant.id);\n      }\n      if (ids.length === 0) return;\n      const lvl = colony.counterLevels.flood || 0;\n      const ratio = Math.max(\n        CH.flood.minRatio,\n        CH.flood.survivorRatio - lvl * CH.flood.ratioRelief\n      );\n      const need = Math.max(1, Math.ceil(ids.length * ratio));\n      colony.activeChallenge = {\n        type: 'flood',\n        kind: 'survive',\n        goal: need,\n        antIds: ids,\n        progress: 0,\n        deadline: t + (detail.durationTicks || config.FLOOD_DURATION)\n      };\n      this.world.log(`考验降临：被洪水围困的 ${ids.length} 只小人中，至少 ${need} 只必须活下来`);\n    }\n  }\n\n  /** 每 tick 检查挑战进度与到期判定 */\n  updateChallenge() {\n    const colony = this.world.colony;\n    const ch = colony.activeChallenge;\n    if (!ch || colony.ended) return;\n\n    // 挖掘者补派：初派的小人可能被吓跑/断路，周期性补足，保证巨石考验始终可解\n    if (ch.kind === 'dig' && colony.totalTicks % 60 === 0) {\n      const assigned = this.ants.ants.filter(a => a.state !== 'dead' && a.digTarget &&\n        a.digTarget.x === ch.rockX && a.digTarget.y === ch.rockY).length;\n      const need = Math.min(config.ROCK.diggersMax, config.ROCK.diggersBase + Math.floor(colony.evolutionStage / 2));\n      if (assigned < need) this.ants.assignDigger(ch.rockX, ch.rockY, need - assigned);\n    }\n\n    if (ch.kind === 'carry') {\n      ch.progress = colony.carriedTotal - ch.carriedAt;\n      if (ch.progress >= ch.goal) { this.resolveChallenge(true); return; }\n    }\n    // dig：成功由 onRockCleared 即时回调；到期时按巨石状态判失败\n    if (ch.kind === 'dig') {\n      if (colony.totalTicks >= ch.deadline) {\n        const tile = this.world.getTile(ch.rockX, ch.rockY);\n        if (tile && tile.object === 'rock') {\n          this.resolveChallenge(false, '巨石纹丝不动');\n        } else if (tile && tile.clearedBy === 'hand') {\n          this.resolveChallenge(false, '神之手代劳了，族群没得到锻炼');\n        } else {\n          this.resolveChallenge(false, '巨石下落不明');\n        }\n      }\n      return;\n    }\n\n    if (colony.totalTicks >= ch.deadline) {\n      if (ch.kind === 'carry') {\n        this.resolveChallenge(false);\n      } else {\n        // 存活判定\n        const aliveSet = new Set(this.ants.ants.filter(a => a.state !== 'dead').map(a => a.id));\n        const survived = ch.antIds.filter(id => aliveSet.has(id)).length;\n        this.resolveChallenge(survived >= ch.goal, `${survived}/${ch.antIds.length} 生还`);\n      }\n    }\n  }\n\n  /** 结算挑战：成功 → 进化进度 + 抗性升级；失败 → 倒扣进度 */\n  resolveChallenge(success, extra) {\n    const colony = this.world.colony;\n    const ch = colony.activeChallenge;\n    colony.activeChallenge = null;\n    const name = { rock: '巨石', flood: '洪水', wind: '飓风' }[ch.type] || ch.type;\n\n    if (success) {\n      colony.challengesSolved++;\n      colony.counterLevels[ch.type] = (colony.counterLevels[ch.type] || 0) + 1;\n      colony.evolutionProgress = Math.min(100, colony.evolutionProgress + config.CHALLENGE.solveProgress);\n      this.world.addEffect('blessing', config.NEST.x, config.NEST.y, 900);\n      this.world.log(`【破解】小人们挺过了${name}的考验${extra ? '（' + extra + '）' : ''}，获得应对经验——下次${name}对它们效果减弱`);\n    } else {\n      colony.challengesFailed++;\n      colony.evolutionProgress = Math.max(0, colony.evolutionProgress - config.CHALLENGE.failPenalty);\n      this.world.log(`【未通过】族群没能应对${name}的考验${extra ? '（' + extra + '）' : ''}，文明陷入迷茫`);\n    }\n  }\n\n  /** 领袖在场检查：协作期起必须有领袖，缺位则推举继承人 */\n  updateLeader() {\n    const colony = this.world.colony;\n    if (colony.evolutionStage < config.LEADER.minStage) return;\n    if (colony.currentLeader) return;\n    if (colony.mourningUntil > colony.totalTicks) return;\n    if (this.ants.aliveCount() === 0) return;\n    this.succeedLeader();\n  }\n\n  /** 寿命：到寿终正寝 */\n  updateAging() {\n    const colony = this.world.colony;\n    for (const ant of this.ants.ants) {\n      if (ant.state === 'dead') continue;\n      ant.age++;\n      // 混乱期体力消耗翻倍\n      const mult = colony.mourningUntil > colony.totalTicks ? config.LEADER.chaosEnergyMult : 1;\n      ant.energy = Math.max(0, ant.energy - 0.005 * mult);\n      if (ant.age >= ant.maxAge) {\n        this.killAnt(ant, '寿终正寝');\n      }\n    }\n  }\n\n  killAnt(ant, reason) {\n    const colony = this.world.colony;\n    ant.state = 'dead';\n    if (ant.buildTarget) {\n      ant.buildTarget.crew = Math.max(0, (ant.buildTarget.crew || 0) - 1);\n      ant.buildTarget = null;\n    }\n    colony.population = this.ants.ants.filter(a => a.state !== 'dead').length;\n\n    if (ant.isLeader) {\n      colony.leaderLineage.push({\n        name: ant.id,\n        gen: ant.generation,\n        reignTicks: ant.age\n      });\n      colony.currentLeader = null;\n      colony.mourningUntil = colony.totalTicks + config.LEADER.transitionTicks;\n      this.world.log(`领袖 ${ant.id} ${reason}，族群陷入哀悼`);\n    } else {\n      this.world.log(`一只小人${reason}`);\n    }\n  }\n\n  /** 繁衍：存粮充足时在巢穴诞生新生命（文明灭亡后停止） */\n  updateBirths() {\n    const colony = this.world.colony;\n    if (colony.ended) return;\n    if (colony.totalTicks - colony.lastBirthTick < config.BIRTH.intervalTicks) return;\n    if (colony.totalFood < config.BIRTH.foodThreshold) return;\n    if (colony.population >= config.BIRTH.maxPopulation) return;\n\n    colony.totalFood -= config.BIRTH.foodCost;\n    colony.lastBirthTick = colony.totalTicks;\n    colony.births++;\n    const gen = (this.ants.ants[0] ? Math.max(...this.ants.ants.map(a => a.generation)) : 1) + Math.floor(colony.births / 5);\n    this.ants.spawnAt(config.NEST.x + randInt(5) - 2, config.NEST.y + randInt(5) - 2, gen);\n    colony.population = this.ants.ants.filter(a => a.state !== 'dead').length;\n    this.world.log(`新的生命在巢穴诞生（人口 ${colony.population}）`);\n  }\n\n  /** 信仰：协作期后缓慢积累 */\n  updateFaith() {\n    const colony = this.world.colony;\n    if (colony.evolutionStage >= 2 && colony.faith < 100) {\n      colony.faith = Math.min(100, colony.faith + 0.008);\n    }\n  }\n\n  /** 进化进度与晋升判定 */\n  updateProgress() {\n    const colony = this.world.colony;\n    if (colony.evolutionStage >= STAGES.length - 1) return;\n    // 哀悼期进化停滞\n    if (colony.mourningUntil > colony.totalTicks) return;\n\n    const rate = RULES.progressPerTick * Math.max(0.5, colony.population / 20);\n    colony.evolutionProgress = Math.min(100, colony.evolutionProgress + rate);\n\n    // 每 60 秒采样一次进度，供 HUD 预估「距下一阶段还要多久」\n    if (colony.totalTicks - (colony.progressSampleTick || 0) >= 1200) {\n      const prev = colony.progressSampleValue || 0;\n      colony.progressPerMin = Math.max(0, colony.evolutionProgress - prev);\n      colony.progressSampleTick = colony.totalTicks;\n      colony.progressSampleValue = colony.evolutionProgress;\n    }\n\n    if (colony.evolutionProgress >= 100) {\n      const need = RULES.stages[colony.evolutionStage];\n      const disasters = colony.eventHistory.flood + colony.eventHistory.earthquake + colony.eventHistory.wind;\n      const ok =\n        (need.needFood === undefined || colony.totalFood >= need.needFood) &&\n        (need.needPop === undefined || colony.population >= need.needPop) &&\n        (need.needCarried === undefined || colony.carriedTotal >= need.needCarried) &&\n        (need.needDisasters === undefined || disasters >= need.needDisasters) &&\n        (need.needBlessings === undefined || colony.eventHistory.blessing >= need.needBlessings) &&\n        (need.needFaith === undefined || colony.faith >= need.needFaith);\n\n      if (ok) {\n        colony.evolutionStage++;\n        colony.evolutionProgress = 0;\n        const stage = STAGES[colony.evolutionStage];\n        colony.unlockedBehaviors.push(stage.name);\n        this.world.log(`【文明进化】进入${stage.name}时代 —— ${stage.desc}`);\n        // 资源开采解锁播报\n        if (colony.evolutionStage === 1) this.world.log('它们学会了爬树，大树上的果实进入了视野');\n        if (colony.evolutionStage === 2) this.world.log('它们学会了搭建木梯与土坡，可以攀上缓坡——山岗上的岩蜜向族群敞开');\n        if (colony.evolutionStage === 3) this.world.log('它们学会了造桥，湖心的莲籽不再是天堑');\n        this.world.addEffect('blessing', config.NEST.x, config.NEST.y, 1500);\n\n        if (colony.evolutionStage >= config.LEADER.minStage && !colony.currentLeader) {\n          this.electLeader();\n        }\n        if (colony.evolutionStage === STAGES.length - 1) {\n          this.buildAltar();\n        }\n      } else {\n        // 卡在 100：给出缺什么的人话提示（只记一次，靠 progress 不再增长的自然间隔）\n        colony.evolutionProgress = 99.5;\n      }\n    }\n  }\n\n  /** 晋升路线图：下一阶段名 + 条件清单 + 预计剩余时间（HUD 用） */\n  getNextStageInfo() {\n    const colony = this.world.colony;\n    if (colony.evolutionStage >= STAGES.length - 1) return null;\n    const next = STAGES[colony.evolutionStage + 1];\n    const need = RULES.stages[colony.evolutionStage];\n    const disasters = colony.eventHistory.flood + colony.eventHistory.earthquake + colony.eventHistory.wind;\n    const conds = [];\n    if (need.needFood !== undefined) conds.push({ label: '存粮', cur: Math.floor(colony.totalFood), need: need.needFood });\n    if (need.needPop !== undefined) conds.push({ label: '人口', cur: colony.population, need: need.needPop });\n    if (need.needCarried !== undefined) conds.push({ label: '累计搬运', cur: colony.carriedTotal, need: need.needCarried });\n    if (need.needDisasters !== undefined) conds.push({ label: '经历灾难', cur: disasters, need: need.needDisasters });\n    if (need.needBlessings !== undefined) conds.push({ label: '祭坛赐福', cur: colony.eventHistory.blessing, need: need.needBlessings });\n    if (need.needFaith !== undefined) conds.push({ label: '信仰度', cur: Math.floor(colony.faith), need: need.needFaith });\n\n    let eta;\n    if (colony.evolutionProgress >= 100) {\n      eta = conds.every(c => c.cur >= c.need) ? '随时晋升！' : '条件达标即晋升';\n    } else if ((colony.progressPerMin || 0) > 0.01) {\n      const mins = Math.max(1, Math.ceil((100 - colony.evolutionProgress) / colony.progressPerMin));\n      eta = `约 ${mins} 分钟（按当前节奏）`;\n    } else {\n      eta = '节奏测量中…（破解考验可加速）';\n    }\n    return { nextName: next.name, conds, eta };\n  }\n\n  /** 选举领袖：勇气最高者 */\n  electLeader() {\n    const alive = this.ants.ants.filter(a => a.state !== 'dead');\n    if (alive.length === 0) return;\n    let best = alive[0];\n    for (const a of alive) {\n      if (a.courage + a.leadership > best.courage + best.leadership) best = a;\n    }\n    best.isLeader = true;\n    this.world.colony.currentLeader = best.id;\n    this.world.log(`${best.id} 被推举为领袖（勇气 ${Math.round(best.courage)}）`);\n  }\n\n  /** 领袖传承：从幸存者中选出继承人 */\n  succeedLeader() {\n    const alive = this.ants.ants.filter(a => a.state !== 'dead' && !a.isLeader);\n    if (alive.length === 0) { this.world.colony.currentLeader = null; return; }\n    let best = alive[0];\n    for (const a of alive) {\n      if (a.leadership + a.courage > best.leadership + best.courage) best = a;\n    }\n    best.isLeader = true;\n    best.generation = Math.max(best.generation, 1);\n    this.world.colony.currentLeader = best.id;\n    this.world.log(`${best.id} 继承了领袖之位`);\n  }\n\n  /** 通讯期：在巢穴附近建祭坛 */\n  buildAltar() {\n    const world = this.world;\n    for (let r = 3; r < 10; r++) {\n      for (let i = 0; i < 30; i++) {\n        const t = world.getTile(\n          config.NEST.x + randInt(r * 2 + 1) - r,\n          config.NEST.y + randInt(r * 2 + 1) - r\n        );\n        if (t && t.walkable && !t.object && t.terrain !== 'water' && t.terrain !== 'food') {\n          t.object = 'alt
