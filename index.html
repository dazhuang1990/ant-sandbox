__define('game-engine/save', "/**\n * 存档（game-engine/save.js）\n * 本地快照：wx.setStorageSync / localStorage 双端兼容，接口由调用方注入\n */\nconst config = require('../data/config');\n\n/** 生成快照（纯数据，无函数） */\nfunction snapshot(world, ants) {\n  return {\n    v: 1,\n    savedAt: Date.now(),\n    tiles: world.tiles.map(t => [\n      t.terrain, t.object, t.walkable ? 1 : 0,\n      t.object === 'rock' ? Math.round(t.rockHp || 0) : 0,\n      t.object === 'rock' ? Math.round(t.rockMaxHp || 0) : 0\n    ]),\n    foodSources: world.foodSources,\n    terrainOverrides: world.terrainOverrides || {},\n    rival: world.rival || null,\n    rivalCrops: world.rivalCrops || [],\n    colony: world.colony,\n    ants: ants.ants.filter(a => a.state !== 'dead').map(a => ({\n      id: a.id, x: a.x, y: a.y,\n      energy: Math.round(a.energy), courage: a.courage, strength: a.strength,\n      carrying: a.carrying, carryAmount: a.carryAmount,\n      energyComfort: a.energyComfort,\n      age: a.age, maxAge: a.maxAge, leadership: a.leadership,\n      isLeader: a.isLeader, generation: a.generation\n    }))\n  };\n}\n\n/** 从快照恢复世界和小人 */\nfunction restore(data, World, AntSystem) {\n  const world = new World();\n  if (!data || !Array.isArray(data.tiles)) return { world, ants: new AntSystem(world) };\n\n  const terrainMap = ['grass', 'dirt', 'stone', 'water', 'food'];\n  data.tiles.forEach((row, i) => {\n    const t = world.tiles[i];\n    if (!t) return;\n    t.terrain = row[0] || 'grass';\n    t.object = row[1] || null;\n    t.walkable = !!row[2];\n    // 巨石耐久（读档后仍可被小人挖掘，耐久条不重置）\n    if (row[3]) { t.rockHp = row[3]; t.rockMaxHp = row[4] || row[3]; }\n  });\n  world.foodSources = (data.foodSources || []).filter(f => world.getTile(f.x, f.y));\n  // 玩家捏地形改写表（旧档无此字段 = 没改过，天然兼容）\n  if (data.terrainOverrides && typeof data.terrainOverrides === 'object') {\n    world.terrainOverrides = data.terrainOverrides;\n  }\n  world.warParties = [];   // 队伍不进存档，读档即回防\n  Object.assign(world.colony, data.colony || {});\n  // 对岸部落：旧档没有 neration || 1\n      });\n    });\n    // 重置自增序列（避免存档恢复后新生命 id 冲突）\n    if (AntSystem.setSeq) AntSystem.setSeq(maxSeq);\n    world.colony.population = ants.aliveCount();\n  }\n  return { world, ants };\n}\n\n/** 平台无关的读写（小程序 / 浏览器注入不同实现） */\nfunction makeStorage(impl) {\n  return {\n    load() {\n      try {\n        const raw = impl.get(config.SAVE_KEY);\n        return raw ? (typeof raw === 'string' ? JSON.parse(raw) : raw) : null;\n      } catch (e) { return null; }\n    },\n    save(data) {\n      try { impl.set(config.SAVE_KEY, JSON.stringify(data)); return true; }\n      catch (e) { return false; }\n    },\n    clear() {\n      try { impl.remove(config.SAVE_KEY); } catch (e) { /* 忽略 */ }\n    }\n  };\n}\n\nmodule.exports = { snapshot, restore, makeStorage };\n");
__define('game-engine/sprite', "/**\n * 像素精灵（game-engine/sprite.js）—— 文档 4.1\n * 8×8 像素矩阵定义小人，行走双帧动画。\n * 绘制时横向合并同色像素，单帧约 8~12 次 fillRect。\n */\nconst P = require('../data/config').PALETTE;\n\n// 色键：X=身体棕  D=深色(腿/轮廓)  W=眼白  R=警示红\nconst C = { X: P.ant_body, D: P.ant_body_dark, W: P.ant_eye, R: '#ff6b6b', Y: '#2f2f38', G: '#e8c46a' };\n\n// 8 列宽矩阵，'.'为透明。小人朝右，眼睛在头前部\nconst SPRITES = {\n  idle: [[\n    '........',\n    '.....WW.',\n    '...XXXX.',\n    '..XXXXX.',\n    '..XXXX..',\n    '..XXXX..',\n    '..D..D..',\n    '........'\n  ]],\n  walking: [[\n    '........',\n    '.....WW.',\n    '...XXXX.',\n    '..XXXXX.',\n    '..XXXX..',\n    '..XXXX..',\n    '.D....D.',\n    '........'\n  ], [\n    '........',\n    '.....WW.',\n    '...XXXX.',\n    '..XXXXX.',\n    '..XXXX..',\n    '..XXXX..',\n    '..DDDD..',\n    '........'\n  ]],\n  carrying: [[\n    '........',\n    '.....WW.',\n    '...XXXX.',\n    '..XXXXX.',\n    '..XXXX..',\n    '..XXXX..',\n    '..D..D..',\n    '........'\n  ]],\n  fleeing: [[\n    '......R.',\n    '.....WW.',\n    '...XXXX.',\n    '..XXXXX.',\n    '..XXXX..',\n    '..XXXX..',\n    '.D....D.',\n    '........'\n  ], [\n    '......R.',\n    '.....WW.',\n    '...XXXX.',\n    '..XXXXX.',\n    '..XXXX..',\n    '..XXXX..',\n    '..DDDD..',\n    '........'\n  ]],\n  organizing: [[\n    '........',\n    '.....WW.',\n    '...XXXX.',\n    '..XXXXX.',\n    '..XXXX..',\n    '..XXXX..',\n    '..D..D..',\n    '........'\n  ]],\n\n  // 黑岩部落战士：黑甲 + 红缨（对岸部落专用）\n  rivalWarrior: [[\n    '....R...',\n    '.....WW.',\n    '...YYYY.',\n    '..YYYYY.',\n    '..YYYY..',\n    '..YYYY..',\n    '..D..D..',\n    '........'\n  ], [\n    '....R...',\n    '.....WW.',\n    '...YYYY.',\n    '..YYYYY.',\n    '..YYYY..',\n    '..YYYY..',\n    '.D....D.',\n    '........'\n  ], [\n    '....R...',\n    '.....WW.',\n    '...YYYY.',\n    '..YYYYY.',\n    '..YYYY..',\n    '..YYYY..',\n    '..DDDD..',\n    '........'\n  ]],\n\n  // 黑岩部落农夫：黑衣 + 肩扛麦色粮袋\n  rivalFarmer: [[\n    '........',\n    '.....WW.',\n    '...YYYY.',\n    '..YYYYY.',\n    '.GYYYY..',\n    '.GYYYY..',\n    '..D..D..',\n    '........'\n  ], [\n    '........',\n    '.....WW.',\n    '...YYYY.',\n    '..YYYYY.',\n    '.GYYYY..',\n    '.GYYYY..',\n    '.D....D.',\n    '........'\n  ], [\n    '........',\n    '.....WW.',\n    '...YYYY.',\n    '..YYYYY.',\n    '.GYYYY..',\n    '.GYYYY..',\n    '..DDDD..',\n    '........'\n  ]]\n};\n\n/**\n * 绘制精灵\n * @param {CanvasRenderingContext2D} ctx\n * @param {string} state  idle/walking/carrying/fleeing/organizing/rivalWarrior/rivalFarmer\n * @param {number} frame  动画帧\n * @param {number} x      左上角屏幕坐标\n * @param {number} y\n * @param {number} px     单像素边长\n * @param {object} [opts] { pal: 色键覆盖表, flip: 水平翻转 }\n */\nfunction drawSprite(ctx, state, frame, x, y, px, opts) {\n  const colors = opts && opts.pal ? Object.assign({}, C, opts.pal) : C;\n  const frames = SPRITES[state] || SPRITES.idle;\n  const m = frames[frame % frames.length];\n  ctx.save();\n  if (opts && opts.flip) {\n    ctx.translate(x + SIZE.w * px, 0);\n    ctx.scale(-1, 1);\n    ctx.translate(-x, 0);\n  }\n  for (let row = 0; row < m.length; row++) {\n    const line = m[row];\n    let col = 0;\n    while (col < line.length) {\n      const ch = line[col];\n      if (ch === '.') { col++; continue; }\n      // 横向合并同色像素\n      let end = col + 1;\n      while (end < line.length && line[end] === ch) end++;\n      ctx.fillStyle = colors[ch];\n      ctx.fillRect(x + col * px, y + row * px, (end - col) * px, px);\n      col = end;\n    }\n  }\n  ctx.restore();\n}\n\n/** 精灵尺寸信息（渲染层定位用） */\nconst SIZE = { w: 8, h: 8 };\n\nmodule.exports = { drawSprite, SIZE, SPRITES };\n");
__define('game-engine/renderer', "/**\n * 渲染器（game-engine/renderer.js）\n * 分层：地形菱形 → 特效 → 食物/巢穴/巨石 → 小人（按 x+y 排序做前后遮挡）→ 粒子\n */\nconst config = require('../data/config');\nconst { gridToScreen } = require('../utils/iso');\nconst sprite = require('./sprite');\nconst elevation = require('./elevation');\n\nconst P = config.PALETTE;\n\nconst TERRAIN_COLORS = {\n  grass: P.grass_dark,\n  dirt: P.dirt,\n  stone: P.stone,\n  water: P.water,\n  shallow: '#7fc4e8',\n  food: P.grass_light,\n  tree: '#3e6b3f',\n  hill: '#a08339',\n  crop: '#b9a35a',\n  bridge: '#b58a4e'\n};\n\n// 海拔色阶：草甸绿为主，高地渐深（参考像素图）\nconst GRASS_TOPS = ['#b7c47d', '#aaba70', '#9bb068', '#89a55f', '#77995a'];\n\nclass Renderer {\n  constructor(ctx, world, ants, canvasW, canvasH) {\n    this.ctx = ctx;\n    this.world = world;\n    this.ants = ants.ants;\n    this.W = canvasW;\n    this.H = canvasH;\n    // 镜头：屏幕偏移 + 缩放 + 旋转（360°）\n    this.cam = { x: canvasW / 2, y: 80, scale: 1, rot: 0 };\n    this.time = 0;\n  }\n\n  /** 网格 → 屏幕（含旋转/缩放/平移，绕沙盘中心旋转） */\n  project(gx, gy) {\n    const p = gridToScreen(gx, gy, config.TILE_SIZE);\n    const c = this._mapCenter || (this._mapCenter = gridToScreen(this.world.width / 2, this.world.height / 2, config.TILE_SIZE));\n    const rot = this.cam.rot || 0;\n    const cos = Math.cos(rot), sin = Math.sin(rot);\n    const dx = p.x - c.x, dy = p.y - c.y;\n    return {\n      x: (dx * cos - dy * sin) * this.cam.scale + this.cam.x,\n      y: (dx * sin + dy * cos) * this.cam.scale + this.cam.y\n    };\n  }\n\n  /** 屏幕 → 网格（逆旋转） */\n  unproject(sx, sy) {\n    const rot = this.cam.rot || 0;\n    const c = this._mapCenter || (this._mapCenter = gridToScreen(this.world.width / 2, this.world.height / 2, config.TILE_SIZE));\n    const x0 = (sx - this.cam.x) / this.cam.scale;\n    const y0 = (sy - this.cam.y) / this.cam.scale;\n    const cos = Math.cos(-rot), sin = Math.sin(-rot);\n    // x0/y0 已是绕中心旋转后的相对向量，反旋转后加回中心\n    const x = x0 * cos - y0 * sin + c.x;\n    const y = x0 * sin + y0 * cos + c.y;\n    const hw = config.TILE_SIZE / 2, qh = config.TILE_SIZE / 4;\n    return {\n      x: Math.floor((x / hw + y / qh) / 2),\n      y: Math.floor((y / qh - x / hw) / 2)\n    };\n  }\n\n  diamond(cx, cy, w, h) {\n    const ctx = this.ctx;\n    ctx.beginPath();\n    ctx.moveTo(cx, cy - h / 2);\n    ctx.lineTo(cx + w / 2, cy);\n    ctx.lineTo(cx, cy + h / 2);\n    ctx.lineTo(cx - w / 2, cy);\n    ctx.closePath();\n  }\n\n  /** 顶面菱形（四角随镜头旋转）：任意角度相邻格共角，接缝无缝不变形 */\n  diamondQ(pos) {\n    const q = this._q;\n    const ctx = this.ctx;\n    ctx.beginPath();\n    ctx.moveTo(pos.x + q.N.x, pos.y + q.N.y);\n    ctx.lineTo(pos.x + q.E.x, pos.y + q.E.y);\n    ctx.lineTo(pos.x + q.S.x, pos.y + q.S.y);\n    ctx.lineTo(pos.x + q.W.x, pos.y + q.W.y);\n    ctx.closePath();\n  }\n\n  /** 地形台阶等级（共享高度场，与寻路同源） */\n  levelAt(x, y) {\n    return elevation.levelAt(this.world, x, y);\n  }\n\n  /** 连续高度（小人/特效用）：四邻插值，水面不参与 */\n  heightAt(fx, fy) {\n    const x0 = Math.floor(fx), y0 = Math.floor(fy);\n    const tx = fx - x0, ty = fy - y0;\n    const lv = (x, y) => {\n      if (x < 0 || y < 0 || x >= this.world.width || y >= this.world.height) return null;\n      const t = this.world.getTile(x, y);\n      if (!t || t.terrain === 'water') return null;\n      if (t.terrain === 'shallow') return 0;   // 浅滩不加高\n      return this.levelAt(x, y);\n    };\n    const corners = [\n      [lv(x0, y0), (1 - tx) * (1 - ty)],\n      [lv(x0 + 1, y0), tx * (1 - ty)],\n      [lv(x0, y0 + 1), (1 - tx) * ty],\n      [lv(x0 + 1, y0 + 1), tx * ty]\n    ];\n    let sum = 0, wsum = 0;\n    for (const [v, w] of corners) {\n      if (v !== null) { sum += v * w; wsum += w; }\n    }\n    return wsum ? sum / wsum : 0;\n  }\n\n  render(dt) {\n    const ctx = this.ctx;\n    const world = this.world;\n    this.time += dt;\n    const tW = config.TILE_SIZE * this.cam.scale;\n    const tH = tW / 2;\n\n    ctx.clearRect(0, 0, this.W, this.H);\n    ctx.fillStyle = P.ui_bg;\n    ctx.fillRect(0, 0, this.W, this.H);\n\n    // ---- 底座层：切土截面 + 木框（旋转感知） ----\n    this.renderBase(tW, tH);\n\n    // ---- 每帧预计算：格子四角的旋转偏移（修 360° 旋转时菱形不跟转导致的接缝变形） ----\n    const rotC = this.cam.rot || 0;\n    const cs = Math.cos(rotC), sn = Math.sin(rotC);\n    const hw0 = tW / 2, qh0 = tH / 2;\n    this._q = {\n      N: { x: qh0 * sn,  y: -qh0 * cs },\n      E: { x: hw0 * cs,  y: hw0 * sn },\n      S: { x: -qh0 * sn, y: qh0 * cs },\n      W: { x: -hw0 * cs, y: -hw0 * sn }\n    };\n    this._ux = { x: cs, y: sn };   // 地图 x 轴方向（水面波纹/苔藓对齐用）\n\n    // ---- 地形层（按旋转后的屏幕深度排序，任意角度遮挡正确） ----\n    this.unit = tH * elevation.UNIT;\n    const tiles = world.tiles\n      .map(t => ({ t, y: this.project(t.x, t.y).y }))\n      .sort((m, n) => m.y - n.y)\n      .map(o => o.t);\n    for (const tile of tiles) {\n      const pos = this.project(tile.x, tile.y);\n      // 视野剔除（含崖壁高度与旋转余量）\n      if (pos.x < -tW || pos.x > this.W + tW || pos.y < -tH * 5 || pos.y > this.H + tH * 5) continue;\n\n      let color = TERRAIN_COLORS[tile.terrain] || P.grass_dark;\n      const lvl = this.levelAt(tile.x, tile.y);\n      // 沙地斑块：低频噪声连片分布\n      const sandPatch = tile.terrain === 'grass' &&\n        elevation.noise(tile.x / 3.1 + 7.7, tile.y / 3.1 + 2.2) < 0.18;\n      if (tile.terrain === 'grass') {\n        color = sandPatch ? '#d2c384' : GRASS_TOPS[lvl];\n      }\n      if (tile.terrain === 'water' || tile.terrain === 'shallow') {\n        const wave = Math.sin(this.time / 500 + tile.x + tile.y) * 12;\n        const lk = world.foodSources.find(fs => fs.type === 'lake');\n        const inLakeZone = lk && Math.abs(tile.x - lk.x) <= 2 && Math.abs(tile.y - lk.y) <= 1\n          && !(Math.abs(tile.x - lk.x) === 2 && Math.abs(tile.y - lk.y) !== 0);\n        if (tile.terrain === 'shallow') {\n          // 浅滩渡口：浅亮色 + 微波，一眼看出能踏水而过\n          color = wave > 0 ? '#9ed8f0' : '#86c9e6';\n        } else {\n          color = wave > 0 ? (inLakeZone ? '#4a9fd8' : '#4a9fd8') : (inLakeZone ? '#2c6ea6' : '#3a86c9');\n        }\n\n        this.diamondQ(pos);\n        ctx.fillStyle = color;\n        ctx.fill();\n\n        // 沙滩岸线（四角随镜头旋转）\n        const q = this._q;\n        const V = {\n          top:    { x: pos.x + q.N.x, y: pos.y + q.N.y },\n          right:  { x: pos.x + q.E.x, y: pos.y + q.E.y },\n          bottom: { x: pos.x + q.S.x, y: pos.y + q.S.y },\n          left:   { x: pos.x + q.W.x, y: pos.y + q.W.y }\n        };\n        const shores = [\n          { dx: 1, dy: 0, a: 'bottom', b: 'right' },\n          { dx: 0, dy: 1, a: 'left', b: 'bottom' },\n          { dx: -1, dy: 0, a: 'left', b: 'top' },\n          { dx: 0, dy: -1, a: 'top', b: 'right' }\n        ];\n        ctx.strokeStyle = '#dbc48c';\n        ctx.lineWidth = Math.max(1.5, tW * 0.045);\n        for (const s of shores) {\n          const n = world.getTile(tile.x + s.dx, tile.y + s.dy);\n          if (n && n.terrain !== 'water' && n.terrain !== 'shallow') {\n            ctx.beginPath();\n            ctx.moveTo(V[s.a].x, V[s.a].y);\n            ctx.lineTo(V[s.b].x, V[s.b].y);\n            ctx.stroke();\n          }\n        }\n        // 波光：1/6 水格淡短亮线（沿地图 x 轴方向，旋转对齐）\n        if (!tile.object && (tile.x * 7 + tile.y * 13) % 6 === 0) {\n          const off = Math.sin(this.time / 700 + tile.x * 1.7 + tile.y) * tW * 0.06;\n          const ux = this._ux;\n          const wx = pos.x + ux.x * off, wy = pos.y + ux.y * off;\n          ctx.strokeStyle = 'rgba(255,255,255,0.26)';\n          ctx.lineWidth = 1.2;\n          ctx.beginPath();\n          ctx.moveTo(wx - ux.x * tW * 0.12, wy - ux.y * tW * 0.12);\n          ctx.lineTo(wx + ux.x * tW * 0.08, wy + ux.y * tW * 0.08);\n          ctx.stroke();\n        }\n        // 湖心莲籽：水下金色光斑\n        if (!tile.object && lk && tile.x === lk.x && tile.y === lk.y && lk.amount > 0) {\n          const glow = Math.max(0.12, 0.35 + Math.sin(this.time / 400) * 0.2);\n          ctx.globalAlpha = glow;\n          ctx.fillStyle = '#ffeaa7';\n          ctx.beginPath();\n          ctx.ellipse(pos.x, pos.y, tW * 0.14, tH * 0.14, rotC, 0, Math.PI * 2);\n          ctx.fill();\n          ctx.globalAlpha = 1;\n        }\n        if (!tile.object) continue;\n      }\n\n      if (tile.terrain === 'hill') {\n        color = world.colony.evolutionStage >= 2 ? '#a08339' : '#8a8f94';\n      }\n      if (tile.terrain === 'bridge') {\n        color = (tile.x + tile.y) % 2 === 0 ? '#b58a4e' : '#9c7642';\n      }\n\n      // 高度台阶：视觉 2.5D 起伏\n      const topY = pos.y - lvl * this.unit;\n      this.drawCliffFaces(tile, pos, topY, lvl, tW, tH, color);\n      pos.y = topY;\n\n      this.diamondQ(pos);\n      ctx.fillStyle = color;\n      ctx.fill();\n\n      // 苔藓点缀：只在一成格子成小簇出现（偏移沿旋转后的地图轴）\n      if (tile.terrain === 'grass' && !sandPatch) {\n        const h = ((tile.x * 73856093) ^ (tile.y * 19349663)) >>> 0;\n        if (h % 10 === 0) {\n          const ux = this._ux, uy = { x: -sn, y: cs };\n          for (let i = 0; i < 2; i++) {\n            const hx = ((h >> (i * 4)) % 17) / 17 - 0.5;\n            const hy = ((h >> (i * 4 + 2)) % 17) / 17 - 0.5;\n            ctx.fillStyle = i % 2 === 0 ? '#7d9455' : '#5f7a42';\n            const s = Math.max(1.5, tW * 0.04);\n            const mx = pos.x + ux.x * hx * tW * 0.6 + uy.x * hy * tH * 0.6;\n            const my = pos.y + ux.y * hx * tW * 0.6 + uy.y * hy * tH * 0.6 - tH * 0.06;\n            ctx.fillRect(mx, my, s, s * 0.7);\n          }\n        }\n      }\n\n      // 物体层\n      if (tile.object === 'rock') {\n        ctx.fillStyle = '#5d6d6e';\n        ctx.fillRect(pos.x - tW * 0.18, pos.y - tH * 0.9, tW * 0.36, tH * 0.8);\n        ctx.fillStyle = P.stone;\n        ctx.fillRect(pos.x - tW * 0.14, pos.y - tH * 0.8, tW * 0.28, tH * 0.6);\n        if (tile.rockMaxHp && tile.rockHp < tile.rockMaxHp) {\n          const pct = Math.max(0, tile.rockHp / tile.rockMaxHp);\n          ctx.fillStyle = 'rgba(0,0,0,0.55)';\n          ctx.fillRect(pos.x - tW * 0.22, pos.y - tH * 1.35, tW * 0.44, 3.5);\n          ctx.fillStyle = pct > 0.4 ? P.ui_success : P.ui_accent;\n          ctx.fillRect(pos.x - tW * 0.22, pos.y - tH * 1.35, tW * 0.44 * pct, 3.5);\n        }\n      } else if (tile.object === 'altar') {\n        ctx.fillStyle = '#ecf0f1';\n        ctx.fillRect(pos.x - tW * 0.1, pos.y - tH * 1.3, tW * 0.2, tH * 1.2);\n        ctx.fillStyle = P.particle_blessing;\n        ctx.fillRect(pos.x - tW * 0.16, pos.y - tH * 1.5, tW * 0.32, tH * 0.25);\n        const glow = 0.5 + Math.sin(this.time / 400) * 0.3;\n        ctx.globalAlpha = glow * 0.5;\n        ctx.beginPath();\n        ctx.ellipse(pos.x, pos.y - tH * 1.4, tW * 0.3, tH * 0.5, 0, 0, Math.PI * 2);\n        ctx.fillStyle = P.particle_blessing;\n        ctx.fill();\n        ctx.globalAlpha = 1;\n      } else if (tile.object === 'nest') {\n        ctx.fillStyle = P.ant_body_dark;\n        ctx.beginPath();\n        ctx.ellipse(pos.x, pos.y - tH * 0.3, tW * 0.26, tH * 0.4, 0, 0, Math.PI * 2);\n        ctx.fill();\n        ctx.fillStyle = P.dirt;\n        ctx.beginPath();\n        ctx.ellipse(pos.x, pos.y - tH * 0.35, tW * 0.14, tH * 0.22, 0, 0, Math.PI * 2);\n        ctx.fill();\n      } else if (tile.object === 'rivalNest') {\n        // 黑岩部落：层叠黑石丘 + 兽骨图腾 + 营火\n        ctx.fillStyle = '#2f2f38';\n        ctx.beginPath();\n        ctx.ellipse(pos.x, pos.y - tH * 0.3, tW * 0.28, tH * 0.42, 0, 0, Math.PI * 2);\n        ctx.fill();\n        // 石块纹理（不规则错落的暗色碎石）\n        ctx.fillStyle = '#4a4a55';\n        ctx.fillRect(pos.x - tW * 0.2, pos.y - tH * 0.5, tW * 0.13, tH * 0.16);\n        ctx.fillRect(pos.x + tW * 0.05, pos.y - tH * 0.62, tW * 0.12, tH * 0.15);\n        ctx.fillRect(pos.x - tW * 0.06, pos.y - tH * 0.34, tW * 0.14, tH * 0.14);\n        ctx.fillStyle = '#57575f';\n        ctx.beginPath();\n        ctx.ellipse(pos.x, pos.y - tH * 0.5, tW * 0.15, tH * 0.2, 0, 0, Math.PI * 2);\n        ctx.fill();\n        // 兽骨图腾（交叉白骨）\n        ctx.strokeStyle = '#d8d3c0';\n        ctx.lineWidth = Math.max(1, tW * 0.03);\n        ctx.beginPath();\n        ctx.moveTo(pos.x - tW * 0.32, pos.y - tH * 0.5);\n        ctx.lineTo(pos.x - tW * 0.2, pos.y - tH * 0.82);\n        ctx.moveTo(pos.x - tW * 0.18, pos.y - tH * 0.52);\n        ctx.lineTo(pos.x - tW * 0.33, pos.y - tH * 0.8);\n        ctx.stroke();\n        // 黑红主旗\n        ctx.strokeStyle = '#101016';\n        ctx.lineWidth = Math.max(1.2, tW * 0.035);\n        ctx.beginPath();\n        ctx.moveTo(pos.x + tW * 0.16, pos.y - tH * 0.6);\n        ctx.lineTo(pos.x + tW * 0.16, pos.y - tH * 1.7);\n        ctx.stroke();\n        const flap = Math.sin(this.time / 300) * tW * 0.02;\n        ctx.fillStyle = '#c0392b';\n        ctx.beginPath();\n        ctx.moveTo(pos.x + tW * 0.16, pos.y - tH * 1.7);\n        ctx.lineTo(pos.x + tW * 0.46 + flap, pos.y - tH * 1.55);\n        ctx.lineTo(pos.x + tW * 0.16, pos.y - tH * 1.4);\n        ctx.closePath();\n        ctx.fill();\n        // 营火（柴堆 + 跳动火焰 + 光晕）\n        const fx = pos.x + tW * 0.42, fy = pos.y + tH * 0.18;\n        ctx.strokeStyle = '#6b4a2a';\n        ctx.lineWidth = Math.max(1.2, tW * 0.035);\n        ctx.beginPath();\n        ctx.moveTo(fx - tW * 0.08, fy);\n        ctx.lineTo(fx + tW * 0.08, fy - tH * 0.08);\n        ctx.moveTo(fx + tW * 0.08, fy);\n        ctx.lineTo(fx - tW * 0.08, fy - tH * 0.08);\n        ctx.stroke();\n        const flick = 0.7 + Math.sin(this.time / 90) * 0.2 + Math.sin(this.time / 37) * 0.1;\n        ctx.globalAlpha = 0.18 * flick;\n        ctx.fillStyle = '#ffb347';\n        ctx.beginPath();\n        ctx.ellipse(fx, fy - tH * 0.15, tW * 0.3 * flick, tH * 0.3 * flick, 0, 0, Math.PI * 2);\n        ctx.fill();\n        ctx.globalAlpha = 1;\n        ctx.fillStyle = '#e8842a';\n        ctx.beginPath();\n        ctx.moveTo(fx, fy - tH * (0.2 + 0.06 * flick));\n        ctx.lineTo(fx - tW * 0.05, fy - tH * 0.04);\n        ctx.lineTo(fx + tW * 0.05, fy - tH * 0.04);\n        ctx.closePath();\n        ctx.fill();\n        ctx.fillStyle = '#ffd166';\n        ctx.beginPath();\n        ctx.moveTo(fx, fy - tH * (0.12 + 0.04 * flick));\n        ctx.lineTo(fx - tW * 0.025, fy - tH * 0.04);\n        ctx.lineTo(fx + tW * 0.025, fy - tH * 0.04);\n        ctx.closePath();\n        ctx.fill();\n        // 巢穴周围的敌方战士（数量 = min(warriors, 8)，肉眼可见敌势壮大）\n        if (world.rival) {\n          const wn = Math.min(8, world.rival.warriors);\n          const ux2 = this._ux, uy2 = { x: -sn, y: cs };\n          for (let i = 0; i < wn; i++) {\n            const ang = (i / 8) * Math.PI * 2 + 0.4;\n            const rr = 0.85;\n            const gx2 = tile.x + 0.5 + (Math.cos(ang) * 0.85);\n            const gy2 = tile.y + 0.5 + (Math.sin(ang) * 0.85);\n            const pos2 = this.project(gx2, gy2);\n            pos2.y -= this.heightAt(gx2, gy2) * this.unit;\n            const bob = Math.sin(this.time / 210 + i * 1.7) * Math.max(0.5, this.cam.scale) * 0.5;\n            sprite.drawSprite(ctx, 'rivalWarrior', 0,\n              pos2.x - sprite.SIZE.w * 1.05 * this.cam.scale / 2, pos2.y - sprite.SIZE.h * 1.05 * this.cam.scale + bob,\n              1.05 * this.cam.scale, { flip: Math.cos(ang) < 0 });\n          }\n        }\n      } else if (tile.terrain === 'tree') {\n        this.drawTree(pos, tW, tH, tile);\n      } else if (tile.terrain === 'hill') {\n        this.drawHill(pos, tW, tH, tile);\n      } else if (tile.terrain === 'food' || tile.terrain === 'bridge') {\n        const f = world.foodSources.find(fs => fs.x === tile.x && fs.y === tile.y);\n        if (f && f.amount > 0) {\n          const n = Math.min(3, Math.ceil(f.amount / 20));\n          ctx.fillStyle = P.food;\n          for (let i = 0; i < n; i++) {\n            ctx.fillRect(pos.x - tW * 0.12 + i * tW * 0.1, pos.y - tH * 0.5 - i * tH * 0.25, tW * 0.12, tH * 0.25);\n          }\n        }\n      } else if (tile.terrain === 'crop') {\n        // 黑岩部落的庄稼：金色麦拇（存量越少越稀疏）\n        const cp = (world.rivalCrops || []).find(cp => cp.x === tile.x && cp.y === tile.y);\n        const n = cp ? Math.max(1, Math.min(4, Math.ceil(cp.amount / 12))) : 2;\n        const ux = this._ux, uy = { x: -sn, y: cs };\n        for (let i = 0; i < n; i++) {\n          const fx = (i % 2) * 0.3 - 0.15 + ((i * 37) % 7) / 40 - 0.08;\n          const fy = Math.floor(i / 2) * 0.28 - 0.14;\n          const bx = pos.x + ux.x * fx * tW + uy.x * fy * tH;\n          const by = pos.y + ux.y * fx * tW + uy.y * fy * tH;\n          ctx.strokeStyle = '#c9a84c';\n          ctx.lineWidth = Math.max(1.2, tW * 0.03);\n          ctx.beginPath();\n          ctx.moveTo(bx, by);\n          ctx.lineTo(bx, by - tH * 0.45);\n          ctx.stroke();\n          ctx.fillStyle = cp && cp.amount > 0 ? '#e8c46a' : '#8a7a45';\n          ctx.beginPath();\n          ctx.ellipse(bx, by - tH * 0.5, tW * 0.05, tH * 0.1, 0, 0, Math.PI * 2);\n          ctx.fill();\n        }\n      }\n    }\n\n    // ---- 特效层 ----\n    this.renderEffects(dt);\n\n    // ---- 小人层（按旋转后的屏幕深度排序） ----\n    const alive = this.ants.filter(a => a.state !== 'dead')\n      .map(ant => ({ ant, y: this.project(ant.x + 0.5, ant.y + 0.5).y }))\n      .sort((m, n) => m.y - n.y);\n    for (const o of alive) {\n      this.drawAnt(o.ant, tW, tH);\n    }\n\n    // ---- 远征/劫掠队层（同款像素小人：玩家棕甲红缨，敌方黑甲红缨） ----\n    const drawUnit = (gx, gy, kind, moving, faceLeft, seed) => {\n      const pos = this.project(gx + 0.5, gy + 0.5);\n      pos.y -= this.heightAt(gx + 0.5, gy + 0.5) * this.unit;\n      const s = Math.max(0.5, this.cam.scale);\n      // 影子\n      ctx.fillStyle = 'rgba(0,0,0,0.25)';\n      ctx.beginPath();\n      ctx.ellipse(pos.x, pos.y, 3.5 * s, 1.8 * s, 0, 0, Math.PI * 2);\n      ctx.fill();\n      const bob = moving ? Math.sin(this.time / 60 + seed * 2.1) * s : 0;\n      const frame = moving ? Math.floor(this.time / 140 + seed) % 2 : 0;\n      sprite.drawSprite(ctx, kind, frame,\n        pos.x - sprite.SIZE.w * 1.15 * s / 2, pos.y - sprite.SIZE.h * 1.15 * s + bob, 1.15 * s,\n        { flip: faceLeft });\n      return pos;\n    };\n    for (const p of (world.warParties || [])) {\n      const isPlayer = p.side === 'player';\n      const node = p.path && p.path[p.pathIdx];\n      const faceLeft = node ? node.x < p.x : false;\n      for (let i = 0; i < p.size; i++) {\n        // 小队错落：排成纵队小方阵\n        const ox = (i % 2) * 0.3 - 0.15, oy = Math.floor(i / 2) * 0.3 - 0.15;\n        const pos = drawUnit(p.x + ox, p.y + oy,\n          isPlayer ? 'rivalWarrior' : 'rivalWarrior', true, faceLeft, i);\n        // 队首扛战旗（红=玩家远征，黑=敌方）\n        if (i === 0) {\n          const flap = Math.sin(this.time / 300) * tW * 0.02;\n          ctx.strokeStyle = isPlayer ? '#7a3b2e' : '#101016';\n          ctx.lineWidth = Math.max(1, tW * 0.025);\n          ctx.beginPath();\n          ctx.moveTo(pos.x, pos.y - tH * 0.75);\n          ctx.lineTo(pos.x, pos.y - tH * 1.35);\n          ctx.stroke();\n          ctx.fillStyle = isPlayer ? '#e74c3c' : '#1d1d26';\n          ctx.beginPath();\n          ctx.moveTo(pos.x, pos.y - tH * 1.35);\n          ctx.lineTo(pos.x + tW * 0.22 + flap, pos.y - tH * 1.22);\n          ctx.lineTo(pos.x, pos.y - tH * 1.1);\n          ctx.closePath();\n          ctx.fill();\n        }\n      }\n      // 行军尘土\n      if (Math.random() < 0.06) {\n        world.spawnParticles(Math.floor(p.x), Math.floor(p.y), 1, isPlayer ? '#e8b0a8' : '#55555f', false);\n      }\n    }\n\n    // ---- 敌方农夫（扛粮）与巡逻队（黑甲红缨，同款站立小人） ----\n    for (const f of (world.rivalForagers || [])) {\n      const node = f.path && f.path[f.pathIdx];\n      const faceLeft = node ? node.x < f.x : false;\n      const moving = !!node && f.harvest <= 0;\n      drawUnit(f.x, f.y, 'rivalFarmer', moving, faceLeft, 3);\n    }\n    if (world.rivalPatrol) {\n      const pt = world.rivalPatrol;\n      const node = pt.path && pt.path[pt.pathIdx];\n      const faceLeft = node ? node.x < pt.x : false;\n      drawUnit(pt.x, pt.y, 'rivalWarrior', !!node, faceLeft, 1);\n      drawUnit(pt.x + 0.3, pt.y + 0.5, 'rivalWarrior', !!node, faceLeft, 2);\n    }\n\n    // ---- 粒子层 ----\n    this.renderParticles(dt);\n\n    // ---- 沙盘编辑预览层（悬停格高亮 + 升降箭头） ----\n    if (this.hoverTile) {\n      const pos = this.project(this.hoverTile.x + 0.5, this.hoverTile.y + 0.5);\n      pos.y -= this.heightAt(this.hoverTile.x + 0.5, this.hoverTile.y + 0.5) * this.unit;\n      const pulse = 0.5 + 0.5 * Math.sin(this.time / 160);\n      const isRaise = this.hoverTile.mode === 'raise';\n      const col = isRaise ? 'rgba(255,176,64,' : 'rgba(96,180,255,';\n      ctx.beginPath();\n      this.diamondQ(pos);\n      ctx.lineWidth = Math.max(2, tW * 0.06);\n      ctx.strokeStyle = col + (0.45 + 0.4 * pulse) + ')';\n      ctx.stroke();\n      // 中央箭头：上指=抬升，下指=下挖\n      ctx.fillStyle = col + (0.6 + 0.35 * pulse) + ')';\n      const ay = isRaise ? -1 : 1;\n      ctx.beginPath();\n      ctx.moveTo(pos.x, pos.y + ay * tH * 0.38);\n      ctx.lineTo(pos.x - tW * 0.12, pos.y - ay * tH * 0.02);\n      ctx.lineTo(pos.x + tW * 0.12, pos.y - ay * tH * 0.02);\n      ctx.closePath();\n      ctx.fill();\n    }\n  }\n\n  drawAnt(ant, tW, tH) {\n    const ctx = this.ctx;\n    // 浮点坐标平滑投影 + 地形高度\n    const pos = this.project(ant.x + 0.5, ant.y + 0.5);\n    pos.y -= this.heightAt(ant.x + 0.5, ant.y + 0.5) * this.unit;\n    const s = Math.max(0.5, this.cam.scale);\n\n    const moving = ant.state === 'walking' || ant.state === 'fleeing' || ant.state === 'digging' || ant.state === 'building';\n    const bob = moving ? Math.sin(this.time / (ant.state === 'digging' || ant.state === 'building' ? 90 : 60) + ant.id.length) * s : 0;\n\n    // 影子\n    ctx.fillStyle = 'rgba(0,0,0,0.25)';\n    ctx.beginPath();\n    ctx.ellipse(pos.x, pos.y, 3.5 * s, 1.8 * s, 0, 0, Math.PI * 2);\n    ctx.fill();\n\n    const state = ant.state === 'carrying' ? 'carrying'\n      : ant.state === 'fleeing' ? 'fleeing'\n      : ant.state === 'organizing' ? 'organizing'\n      : moving ? 'walking' : 'idle';\n    const frame = (ant.state === 'digging')\n      ? Math.floor(this.time / 110) % 2\n      : (state === 'walking' || state === 'fleeing')\n        ? Math.floor(this.time / 140) % 2 : 0;\n    const px = 1.15 * s;\n    sprite.drawSprite(ctx, state, frame, pos.x - sprite.SIZE.w * px / 2, pos.y - sprite.SIZE.h * px + bob, px);\n\n    if (ant.isLeader) {\n      ctx.fillStyle = P.ant_leader_crown;\n      const cw = 4 * s;\n      ctx.fillRect(pos.x - cw / 2, pos.y - sprite.SIZE.h * px - 1.2 * s + bob, cw, 1.2 * s);\n      ctx.fillRect(pos.x - cw / 2, pos.y - sprite.SIZE.h * px - 2.2 * s + bob, 1.2 * s, 1.2 * s);\n      ctx.fillRect(pos.x + cw / 2 - 1.2 * s, pos.y - sprite.SIZE.h * px - 2.2 * s + bob, 1.2 * s, 1.2 * s);\n    }\n\n    if (ant.carrying) {\n      const fy = ant.isLeader ? 11.4 : 9.4;\n      ctx.fillStyle = P.food;\n      ctx.fillRect(pos.x - 1.6 * s, pos.y - fy * s + bob, 3.2 * s, 2 * s);\n    }\n\n    if (ant.state === 'organizing') {\n      ctx.fillStyle = P.particle_water;\n      const pulse = 2.5 + Math.sin(this.time / 150) * 1.5;\n      ctx.fillRect(pos.x - pulse * s / 2, pos.y - sprite.SIZE.h * px - 4.5 * s, pulse * s, pulse * s);\n    }\n  }\n\n  /** 果树（billboard 精灵，整体放大） */\n  drawTree(pos, tW, tH, tile) {\n    const ctx = this.ctx;\n    ctx.save();\n    ctx.translate(pos.x, pos.y);\n    ctx.scale(1.12, 1.12);\n    ctx.translate(-pos.x, -pos.y);\n    const f = this.world.foodSources.find(fs => fs.x === tile.x && fs.y === tile.y);\n    ctx.fillStyle = 'rgba(0,0,0,0.22)';\n    ctx.beginPath();\n    ctx.ellipse(pos.x, pos.y + 1, tW * 0.3, tH * 0.16, 0, 0, Math.PI * 2);\n    ctx.fill();\n    const tw = tW * 0.09, th = tH * 0.95;\n    ctx.fillStyle = '#5d3f22';\n    ctx.beginPath();\n    ctx.moveTo(pos.x - tw * 0.7, pos.y);\n    ctx.lineTo(pos.x - tw * 0.45, pos.y - th);\n    ctx.lineTo(pos.x + tw * 0.45, pos.y - th);\n    ctx.lineTo(pos.x + tw * 0.7, pos.y);\n    ctx.closePath();\n    ctx.fill();\n    ctx.fillStyle = '#3f2a15';\n    ctx.fillRect(pos.x + tw * 0.15, pos.y - th, tw * 0.3, th);\n    const cx = pos.x, cy = pos.y - th;\n    const blobs = [\n      { dx: -0.14, dy: -0.10, r: 0.20, c: '#2c5231' },\n      { dx: 0.15, dy: -0.12, r: 0.19, c: '#2c5231' }     updateUndoBtn();
  }
  // 撤销按钮：仅在地形笔选中时显示（Ctrl+Z / ⌘Z 也行）
  var undoBtn = document.getElementById('btn-undo');
  function updateUndoBtn() {
    undoBtn.style.display = (selected === 'raise' || selected === 'lower') ? 'block' : 'none';
  }
  undoBtn.addEventListener('click', function() { showResult(world.undoTerrainEdit()); });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      showResult(world.undoTerrainEdit());
    }
  });
  document.getElementById('btn-pause').addEventListener('click', function() {
    paused = !paused;
    this.classList.toggle('active', paused);
    this.querySelector('.tool-icon').textContent = paused ? '▶️' : '⏸️';
    this.querySelector('.tool-name').textContent = paused ? '继续' : '暂停';
    clearSelection();
  });

  // ---------- 触控 / 鼠标（Pointer Events 统一处理） ----------
  var pointers = new Map();
  var startInfo = null, camStart = null, pinchStart = 0, scaleStart = 1, angleStart = 0, rotStart = 0;

  canvas.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      startInfo = { x: e.clientX, y: e.clientY, t: Date.now(), moved: false };
      camStart = { x: renderer.cam.x, y: renderer.cam.y };
      // 捏地形笔：左键/触摸按下即落笔，拖动连捏；右键保持平移
      if ((selected === 'raise' || selected === 'lower') && e.button === 0) {
        startInfo.paint = true;
        paintAt(e.clientX, e.clientY);
      }
    } else if (pointers.size === 2) {
      var pts = Array.from(pointers.values());
      pinchStart = dist(pts[0], pts[1]);
      scaleStart = renderer.cam.scale;
      angleStart = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
      rotStart = renderer.cam.rot || 0;
      startInfo = null; // 双指时不触发点按/涂刷
    }
  });
  canvas.addEventListener('pointermove', function(e) {
    // 悬停预览：鼠标不按下也跟随（触摸仅拖动时可见）
    if (selected === 'raise' || selected === 'lower') {
      var hg = renderer.unproject(e.clientX, e.clientY);
      renderer.hoverTile = world.getTile(hg.x, hg.y)
        ? { x: hg.x, y: hg.y, mode: selected } : null;
    }
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1 && startInfo) {
      var dx = e.clientX - startInfo.x, dy = e.clientY - startInfo.y;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) startInfo.moved = true;
      if (startInfo.paint) {
        paintAt(e.clientX, e.clientY);   // 拖动连捏，不平移镜头
      } else {
        renderer.cam.x = camStart.x + dx;
        renderer.cam.y = camStart.y + dy;
      }
    } else if (pointers.size === 2 && pinchStart) {
      var pts = Array.from(pointers.values());
      var ratio = dist(pts[0], pts[1]) / pinchStart;
      renderer.cam.scale = Math.max(config.SCALE_MIN, Math.min(config.SCALE_MAX, scaleStart * ratio));
      // 双指旋转让沙盘 360° 转动
      var ang = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
      renderer.cam.rot = rotStart + (ang - angleStart);
    }
  });
  function onPointerUp(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 0 && startInfo && !startInfo.moved && Date.now() - startInfo.t < 400) {
      if (e.button !== 2 && !(selected === 'raise' || selected === 'lower')) {
        onTapMap(e.clientX, e.clientY);   // 捏地形笔已在按下时落笔，不重复
      }
    }
    if (pointers.size === 0) { startInfo = null; pinchStart = 0; }
    if (e.pointerType !== 'mouse') renderer.hoverTile = null;  // 触摸抬手隐藏预览
  }
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  function dist(a, b) { return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)) || 1; }

  // 捏地形落笔（按下/拖动共用）：节流与护栏由干预系统管，拖动时只报结果和粮食不足
  var lastPaintKey = '', lastPaintTime = 0;
  function paintAt(sx, sy) {
    var g = renderer.unproject(sx, sy);
    var key = g.x + ',' + g.y;
    if (key === lastPaintKey && Date.now() - lastPaintTime < 120) return;
    lastPaintKey = key; lastPaintTime = Date.now();
    var r = interventions.execute(selected, g.x, g.y);
    if (r.ok || /神力不足/.test(r.msg)) toast((r.ok ? '' : '❌ ') + r.msg, !r.ok);
  }

  // 滚轮：缩放；Shift+滚轮：旋转（桌面端）
  canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    if (e.shiftKey) {
      renderer.cam.rot = (renderer.cam.rot || 0) + (e.deltaY > 0 ? 0.12 : -0.12);
    } else {
      var factor = e.deltaY < 0 ? 1.1 : 0.9;
      renderer.cam.scale = Math.max(config.SCALE_MIN, Math.min(config.SCALE_MAX, renderer.cam.scale * factor));
    }
  }, { passive: false });

  function onTapMap(sx, sy) {
    if (!selected) return;
    if (selected === 'wind') {
      showResult(interventions.execute('wind'));
      clearSelection();
      return;
    }
    var g = renderer.unproject(sx, sy);
    // 捏地形保持选中，方便连续搭建；其他干预用完即收
    if (selected === 'raise' || selected === 'lower') {
      showResult(interventions.execute(selected, g.x, g.y));
      return;
    }
    showResult(interventions.execute(selected, g.x, g.y));
    clearSelection();
  }
  function showResult(r) {
    toast((r.ok ? '' : '❌ ') + r.msg, !r.ok);
  }

  // ---------- 主循环 ----------
  var saveTimer = 0;
  function doSave() {
    if (!world || !ants) return;
    storage.save(saveUtil.snapshot(world, ants));
  }
  function loop(now) {
    if (destroyed) return;
    var dt = Math.min(100, now - (lastFrame || now));
    lastFrame = now;
    if (!paused) {
      acc += dt;
      var mult = world.speedMult();
      var n = 0;
      while (acc >= config.TICK_MS && n < mult) { world.tick(); ants.tick(); evolution.tick(); rivalAI.tick(); acc -= config.TICK_MS; n++; }
      if (acc > config.TICK_MS * mult) acc = 0;
    }
    renderer.render(dt);
    saveTimer += dt;
    if (saveTimer > config.SAVE_INTERVAL_MS) { saveTimer = 0; doSave(); }
    uiTimer += dt;
    if (uiTimer > 500) {
      uiTimer = 0;
      var c = world.colony;
      document.getElementById('hud-pop').textContent = '👥 ' + c.population;
      document.getElementById('hud-food').textContent = '🍞 ' + Math.floor(c.totalFood);
      document.getElementById('hud-day').textContent = '⏱ ' + Math.floor(c.totalTicks / 1200) + ' 天';
      document.getElementById('hud-stage').innerHTML =
        config.EVOLUTION_STAGES[c.evolutionStage].name + ' <span id="hud-progress">' + Math.floor(c.evolutionProgress) + '%</span>';
      var rival = world.rival;
      if (rival) {
        var moodText = { dormant: '🏡 对岸：平静', hostile: '⚔️ 黑岩部落：敌对', vengeful: '🔥 黑岩部落：记仇', subjugated: '🏳️ 黑岩部落：已臣服' }[rival.mood];
        if (rival.mood !== 'dormant' && rival.mood !== 'subjugated') moodText += '（战士' + rival.warriors + '·存粮' + Math.floor(rival.food) + '）';
        document.getElementById('hud-rival').textContent = moodText;
      }
      var log = c.eventsLog[0];
      document.getElementById('log').textContent = log ? '📜 ' + log.text : '';
      var chEl = document.getElementById('challenge');
      if (c.activeChallenge) {
        var ch = c.activeChallenge;
        var left = Math.max(0, Math.ceil((ch.deadline - c.totalTicks) * config.TICK_MS / 1000));
        var cname = { rock: '巨石', flood: '洪水', wind: '飓风' }[ch.type];
        chEl.textContent = ch.kind === 'carry'
          ? '⚔️ 破解' + cname + '考验：搬回 ' + ch.progress + '/' + ch.goal + ' 份食物（剩 ' + left + ' 秒）'
          : '⚔️ 破解' + cname + '考验：存活 ' + ch.goal + ' 只（剩 ' + left + ' 秒）';
        chEl.style.display = 'block';
      } else {
        chEl.style.display = 'none';
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.addEventListener('beforeunload', doSave);

  // ---------- 晋升路线图（点 HUD 阶段进度条） ----------
  var stageOverlay = document.createElement('div');
  stageOverlay.style.cssText = 'display:none; position:fixed; inset:0; background:rgba(26,26,46,.95); z-index:60; overflow-y:auto; padding:16px;';
  document.body.appendChild(stageOverlay);
  window.__closeStage = function() { stageOverlay.style.display = 'none'; paused = false; };
  document.getElementById('hud-stage').addEventListener('click', function() {
    var info = evolution.getNextStageInfo();
    var html;
    if (!info) {
      html = '<div style="text-align:right; cursor:pointer; font-size:22px; padding:4px 12px;" onclick="window.__closeStage()">✕</div>'
        + '<div style="font-size:18px; color:#e8e8e8; text-align:center; margin-top:30vh;">🏆 已达最高文明</div>';
    } else {
      var condsHtml = info.conds.map(function(c) {
        var ok = c.cur >= c.need;
        return (ok ? '✅' : '⬜') + ' ' + c.label + ' <b>' + c.cur + '/' + c.need + '</b>';
      }).join('<br>') || '进度积累中';
      html = '<div style="text-align:right; cursor:pointer; font-size:22px; padding:4px 12px;" onclick="window.__closeStage()">✕</div>'
        + '<div style="font-size:18px; color:#e8e8e8; text-align:center; margin-top:12vh;">📈 晋升【<b style="color:#e94560">' + info.nextName + '</b>】</div>'
        + '<div style="color:#9aa4c0; text-align:center; margin:8px 0 16px;">预计 ' + info.eta + '</div>'
        + '<div style="line-height:2.2; text-align:center; color:#c5cbe0;">' + condsHtml + '</div>'
        + '<div style="color:#55556a; text-align:center; margin-top:16px; font-size:12px;">破解考验可大幅加速进化（进度 +15/次）</div>';
    }
    stageOverlay.innerHTML = html;
    stageOverlay.style.display = 'block';
    paused = true;
  });

  // ---------- 史记浮层 ----------
  var overlay = document.getElementById('history-overlay');
  document.getElementById('btn-history').addEventListener('click', function() {
    doSave();
    var c = world.colony;
    var stage = config.EVOLUTION_STAGES[c.evolutionStage];
    var stagesHtml = config.EVOLUTION_STAGES.map(function(s, i) {
      var mark = i < c.evolutionStage ? '✅' : (i === c.evolutionStage ? '🔴' : '⚪');
      return mark + ' <b>' + s.name + '</b> — ' + s.desc;
    }).join('<br>');
    var lineage = (c.leaderLineage || []).slice(-10).reverse().map(function(l) {
      return '👑 ' + l.name + '（第 ' + l.gen + ' 代，享年 ' + Math.floor(l.reignTicks / 1200) + ' 天）';
    }).join('<br>') || '尚无领袖离世';
    var logs = (c.eventsLog || []).slice(0, 60).map(function(e) {
      return '<span style="color:#55556a">第' + Math.floor(e.tick / 1200) + '天</span> ' + e.text;
    }).join('<br>');
    document.getElementById('history-body').innerHTML =
      '<div style="font-size:16px;color:#e8e8e8"><b>' + stage.name + '时代</b> · 第' + Math.floor(c.totalTicks / 1200) + '天 · 人口' + c.population + ' · 信仰' + Math.floor(c.faith || 0) + '%</div>'
      + '<div style="margin:10px 0;">' + stagesHtml + '</div>'
      + '<div style="color:#9aa4c0;margin-bottom:10px;">' + lineage + '</div>'
      + logs;
    overlay.style.display = 'block';
    paused = true;
  });
  document.getElementById('btn-close-history').addEventListener('click', function() {
    overlay.style.display = 'none';
    paused = false;
    document.getElementById('btn-pause').classList.remove('active');
    document.getElementById('btn-pause').querySelector('.tool-icon').textContent = '⏸️';
    document.getElementById('btn-pause').querySelector('.tool-name').textContent = '暂停';
  });
  document.getElementById('btn-reset').addEventListener('click', function() {
    if (confirm('将清除全部存档，当前文明的一切都会消失。确定吗？')) {
      storage.clear();
      location.reload();
    }
  });

  // ---------- 祭坛：点祭坛 = 免费回应赐福（放在 onTapMap 前拦截） ----------
  var _origOnTapMap = onTapMap;
  onTapMap = function(sx, sy) {
    var g = renderer.unproject(sx, sy);
    var tile = world.getTile(g.x, g.y);
    if (tile && tile.object === 'altar') {
      showResult(evolution.respondAltar());
      return;
    }
    _origOnTapMap(sx, sy);
  };
})();
</script>
</body>
</html>
